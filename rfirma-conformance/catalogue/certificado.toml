citation = "AOKeyStoreDialog.java:227-262; KeyStorePreferencesManager.java:365-375; ProtocolInvocationLauncherSelectCert.java:102-110"
statement = """
El almacén al que la persona cambia en el diálogo de selección queda recordado en el proceso, no en
