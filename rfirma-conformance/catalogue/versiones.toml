# Entradas del catálogo de la suite de conformidad para el conjunto «versiones».
# Lo lee `catalogue.rs`, que valida la forma de cada entrada al arrancar.

[[check]]
id = "operation_supported_protocol_version"
set = "versiones"
chapter = "14"
citation = "ProtocolVersion.java:60-62; ProtocolInvocationLauncher.java:62, 907-915"
statement = """
Las operaciones aceptan versiones de protocolo menores o iguales a 4
(MAX_PROTOCOL_VERSION_SUPPORTED).
"""
drive = { mode = "v4", script = "protocol-v4-operations" }
assistance = "none"
condition = "ver-4-passes"

[[check]]
id = "websocket_operation_protocol_version_ignored"
set = "versiones"
chapter = "14"
citation = "AfirmaWebSocketServerV4.java:91; ProtocolInvocationLauncher.java:189, 653-655"
statement = """
Por el canal WebSocket la versión de protocolo de la operación la fija el canal: un ver=5 en la
petición se ignora, no se rechaza con SAF_21, y la operación sigue hasta su siguiente comprobación.
"""
drive = { mode = "v4", script = "protocol-v4-operations" }
assistance = "none"
condition = "ver-5-is-ignored"

[[check]]
id = "operation_minimum_client_version_satisfied"
set = "versiones"
chapter = "14"
citation = "Version.java:120-169; ProtocolInvocationLauncherSign.java:143-150"
statement = """
Si mcv solicita una versión igual o inferior a la versión del aplicativo (p. ej. mcv=1.0.0), la
operación continúa sin error de versión.
"""
drive = { mode = "v4", script = "protocol-v4-operations" }
assistance = "none"
condition = "mcv-below-the-client-passes"

[[check]]
id = "operation_minimum_client_version_unsatisfied_rejected"
set = "versiones"
chapter = "14"
citation = "Version.java:120-169; ProtocolInvocationLauncherSign.java:143-150; ProtocolInvocationLauncherErrorManager.java:72"
statement = """
Si mcv solicita una versión superior a la de la aplicación (p. ej. mcv=99.0.0), la operación es
rechazada con SAF_41.
"""
drive = { mode = "v4", script = "protocol-v4-operations" }
assistance = "none"
condition = "mcv-above-the-client-saf-41"

[[check]]
id = "websocket_handshake_without_session_accepted"
set = "versiones"
chapter = "14"
citation = "AfirmaWebSocketServerV4.java:56-78"
statement = """
En versión 4 el apretón de manos WebSocket no exige idsession en la query string: la conexión sin
él se acepta y la credencial se comprueba en cada mensaje.
"""
drive = { mode = "v4", script = "protocol-v4" }
assistance = "none"
condition = "the-echo-with-its-session-answers-ok"

[[check]]
