# Puerta automatica del repositorio: `just check` repartido en un job por cadena (ADR-0014).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Mantiene calientes las caches y alimenta 'fnmt-kit-expiry-warning'.
    - cron: '17 4 * * 1'

permissions:
  contents: read

# Solo en PR: en main cada commit merece su ejecucion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # CARRIL RAPIDO
  # ==========================================================================
  # Cada job instala SOLO lo de su cadena. Los tres arrancan a la vez, asi que
  # la espera es la del mas lento (Rust) y no la suma.

  # --------------------------------------------------------------------------
  # Solo en un PR sin la etiqueta 'ci-full' puede saltarse un carril, y solo si
  # scripts/ci-lanes.sh prueba que ningun fichero del PR lo afecta.
  scope:
    name: Alcance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      java: ${{ steps.lanes.outputs.java }}
      web: ${{ steps.lanes.outputs.web }}
      rust: ${{ steps.lanes.outputs.rust }}
      native: ${{ steps.lanes.outputs.native }}
      landing: ${{ steps.lanes.outputs.landing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci-lanes.sh
          sparse-checkout-cone-mode: false

      - name: Decide que carriles corren
        id: lanes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full') }}
        run: |
          : > files
          if [ "$EVENT" != pull_request ]; then
            reason="evento $EVENT"
          elif [ "$FULL" = true ]; then
            reason="etiqueta ci-full"
          elif [ "$CHANGED_FILES" -ge 3000 ]; then
            reason="$CHANGED_FILES ficheros, mas de los que lista la API"
          elif ! gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
              --jq '.[] | .filename, (.previous_filename // empty)' > files; then
            : > files
            reason="la API no dio la lista de ficheros"
          else
            reason="ficheros del PR"
          fi
          scripts/ci-lanes.sh < files | tee -a "$GITHUB_OUTPUT" > lanes
          {
            echo "### Carriles ($reason)"
            echo
            sed 's/=true$/: corre/; s/=false$/: omitido, ningun fichero del PR lo afecta/; s/^/- /' lanes
            echo
            echo "Pon la etiqueta \`ci-full\` en el PR y empuja para correrlos todos."
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  java:
    name: Cadena Java
    needs: scope
    if: needs.scope.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-runner
        with:
          java: graalvm
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - run: just check-java

  # --------------------------------------------------------------------------
  web:
    name: Cadena TypeScript
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-runner
        with:
          node: true
          apt: repo
          tools: ruff
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      # `check-repo` viaja aqui porque son sellos de milisegundos.
      - run: just check-repo check-ts

  # --------------------------------------------------------------------------
  landing:
    name: Landing
    needs: scope
    if: needs.scope.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-runner
        with:
          node: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - run: just check-landing

  # --------------------------------------------------------------------------
  rust:
    name: Cadena Rust
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tauri-build lee frontendDist dentro de su build.rs, asi que Rust necesita Node.
      - uses: ./.github/actions/setup-runner
        with:
          rust: lint
          node: true
          apt: test
          tools: llvm-cov crap machete diff-cover
          autoscript: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - run: just check-rust

      # `check-rust` corre sin red (ADR-0013): el fetch va aqui, no en el justfile.
      - name: Cobertura del diff contra origin/main
        run: |
          git fetch --depth=1 origin main
          just diff-coverage

  # ==========================================================================
  # CARRIL LENTO
  # ==========================================================================
  native:
    name: Imagen nativa
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/native-tier
        with:
          library: build
          save-cache: ${{ github.ref == 'refs/heads/main' }}

  # ==========================================================================
  # CARRIL DE WINDOWS
  # ==========================================================================
  # Segunda plataforma (ADR-0035): sin grada B ni C, y sin vitest.
  windows:
    name: Windows
    needs: scope
    if: needs.scope.outputs.rust == 'true' || needs.scope.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      # Sin esto el checkout deja los .sh con CRLF y bash no los lee.
      - name: Fin de linea sin conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-runner
        with:
          rust: lint
          node: true
          java: graalvm
          tools: llvm-cov crap
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      # Restaurar y guardar por separado: la .dll se guarda en cuanto existe,
      # aunque un paso posterior falle.
      - name: Cache de rfirma_crypto.dll
        id: cache-native-lib
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rfirma-native-bridge/target/lib/rfirma
          key: native-lib-${{ runner.os }}-graalvm${{ env.GRAALVM_VERSION }}-autofirma${{ env.AUTOFIRMA_VERSION }}-${{ hashFiles('scripts/bootstrap.sh', 'rfirma-native-bridge/pom.xml', 'rfirma-native-bridge/src/main/**') }}

      - name: Construye la libreria nativa
        if: steps.cache-native-lib.outputs.cache-hit != 'true'
        run: just native
      - name: Guarda rfirma_crypto.dll
        if: steps.cache-native-lib.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rfirma-native-bridge/target/lib/rfirma
          key: ${{ steps.cache-native-lib.outputs.cache-primary-key }}

      - name: Interfaz compilada
        run: just build-ts

      - name: rustfmt y clippy
        run: just lint-rust

      # El adaptador CNG solo compila aqui: Linux lo oculta de su puerta CRAP (ADR-0014, ADR-0035).
      - name: Pruebas de --lib y del canal local, y CRAP del adaptador CNG
        run: just test-windows

  # ==========================================================================
  # CARRIL DE MACOS
  # ==========================================================================
  # Tercera plataforma (ADR-0040): como Windows, sin grada B ni C, y sin vitest.
  macos:
    name: macOS
    needs: scope
    if: needs.scope.outputs.rust == 'true' || needs.scope.outputs.native == 'true'
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-runner
        with:
          rust: lint
          node: true
          java: graalvm
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache de librfirma_crypto.dylib
        id: cache-native-lib
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rfirma-native-bridge/target/lib/rfirma
          key: native-lib-${{ runner.os }}-graalvm${{ env.GRAALVM_VERSION }}-autofirma${{ env.AUTOFIRMA_VERSION }}-${{ hashFiles('scripts/bootstrap.sh', 'rfirma-native-bridge/pom.xml', 'rfirma-native-bridge/src/main/**') }}

      - name: Construye la libreria nativa
        if: steps.cache-native-lib.outputs.cache-hit != 'true'
        run: just native
      - name: Guarda librfirma_crypto.dylib
        if: steps.cache-native-lib.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rfirma-native-bridge/target/lib/rfirma
          key: ${{ steps.cache-native-lib.outputs.cache-primary-key }}

      - name: Interfaz compilada
        run: just build-ts

      - name: rustfmt y clippy
        run: just lint-rust

      - name: Pruebas de --lib y del canal local
        run: just test-macos

  # CALENTADOR DE CACHES DE LA ENTREGA
  # ==========================================================================
  # Una etiqueta solo lee las caches de `main`: cada sistema compila aqui la
  # misma receta que build.yml. Ninguna PR lo arranca (ADR-0035).
  warm-release-cache:
    name: Calienta la cache de la entrega
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"runner":"ubuntu-latest","timeout":60,"apt":"tauri","java":"none","native":false,"recipe":"build-rust"}]' || '[{"runner":"windows-latest","timeout":90,"apt":"none","java":"graalvm","native":true,"recipe":"bundle"},{"runner":"macos-14","timeout":90,"apt":"none","java":"graalvm","native":true,"recipe":"bundle"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: bash
    steps:
      # Sin esto el checkout de Windows deja los .sh con CRLF y bash no los lee.
      - name: Fin de linea sin conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-runner
        with:
          rust: release
          node: true
          apt: ${{ matrix.apt }}
          java: ${{ matrix.java }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      # La libreria la deja el carril de su sistema; aqui solo se lee, y si no
      # esta se compila: `tauri build` la necesita como recurso.
      - name: Cache de la libreria nativa
        if: matrix.native
        id: cache-native-lib
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rfirma-native-bridge/target/lib/rfirma
          key: native-lib-${{ runner.os }}-graalvm${{ env.GRAALVM_VERSION }}-autofirma${{ env.AUTOFIRMA_VERSION }}-${{ hashFiles('scripts/bootstrap.sh', 'rfirma-native-bridge/pom.xml', 'rfirma-native-bridge/src/main/**') }}

      - name: Construye la libreria nativa
        if: matrix.native && steps.cache-native-lib.outputs.cache-hit != 'true'
        run: just native

      # La misma receta que la release: con otra orden cambiarian las
      # features de tauri y la cache no le serviria.
      - name: Compila como la release
        run: just ${{ matrix.recipe }}

  # Avisa aqui y no en el carril rapido para no romper todas las PR a la vez (ADR-0014).
  fnmt-kit-expiry-warning:
    name: Caducidad del kit FNMT
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      # notAfter de testdata/fnmt/active-rsa.p12. Tiene que coincidir con
      # ACTIVE_EXPIRY_ISO de tests/fnmt_kit.rs y con testdata/fnmt/README.md.
      EXPIRY_DATE: '2028-10-30'
      STCERES: 'https://www.sede.fnmt.gob.es/documents/10445900/10649507/Certificados_pruebas_todas_CAs.rar'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Avisa si quedan menos de 90 dias
        run: |
          set -euo pipefail
          days_left=$(( ( $(date -u -d "$EXPIRY_DATE" +%s) - $(date -u +%s) ) / 86400 ))
          echo "Quedan $days_left dias para el $EXPIRY_DATE." >> "$GITHUB_STEP_SUMMARY"
          if [ "$days_left" -gt 90 ]; then
            exit 0
          fi

          title="El kit FNMT de testdata/fnmt/ caduca el $EXPIRY_DATE"
          # Una sola issue viva: sin esto el cron abriria una cada lunes
          # durante trece semanas.
          open_count=$(gh issue list --state open --search "$title in:title" \
            --json number --jq 'length')
          if [ "$open_count" != "0" ]; then
            echo "Ya hay una issue abierta; no se abre otra." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # El cuerpo va a un fichero, no a un $(cat <<...) en linea: dentro de
          # un bloque YAML el heredoc conservaria la sangria de cada linea y el
          # markdown llegaria a la issue como un bloque de codigo.
          body=$(mktemp)
          {
            printf '`testdata/fnmt/active-rsa.p12` caduca el **%s**: quedan **%s dias**.\n\n' \
              "$EXPIRY_DATE" "$days_left"
            printf 'Es el certificado del camino feliz, el que esta en el token SoftHSM `rfirma-test`.\n'
            printf 'Cuando caduque, `rfirma-app/src-tauri/tests/fnmt_kit.rs` empezara a fallar en el\n'
            printf 'carril rapido y bloqueara todas las entregas.\n\n'
            printf '## Que hay que hacer\n\n'
            printf '1. Descargar el kit nuevo de <%s>.\n' "$STCERES"
            printf '2. Sustituir los tres `.p12` de `testdata/fnmt/`.\n'
            printf '3. Actualizar las huellas SHA-256 y las fechas en `testdata/fnmt/README.md` y en\n'
            printf '   `rfirma-app/src-tauri/tests/fnmt_kit.rs` (`FINGERPRINTS`, `ACTIVE_EXPIRY_EPOCH`,\n'
            printf '   `ACTIVE_EXPIRY_ISO`), y la `EXPIRY_DATE` de este workflow.\n'
            printf '4. Reimportar el certificado activo en SoftHSM segun\n'
            printf '   `docs/research/token-pkcs11-pruebas.md`.\n\n'
            printf 'Abierta automaticamente por el cron semanal de `.github/workflows/ci.yml`\n'
            printf '(ADR-0014, TD-07).\n'
          } > "$body"

          gh issue create --title "$title" --label needs-triage --body-file "$body"
