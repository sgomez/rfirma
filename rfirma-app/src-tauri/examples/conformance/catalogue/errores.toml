[[check]]
id = "signandsave_rejects_a_request_without_a_verb_with_saf_04"
suite = "errores"
chapter = "07"
citation = "UrlParametersToSignAndSave.java:29, 237; ProtocolInvocationLauncherSignAndSave.java:155, 728"
statement = """
Una invocación de signandsave sin cop se rechaza con SAF_04, el mismo código con el que sign
rechaza un verbo ausente o no reconocido.
"""
drive = { mode = "v4", script = "signandsavewithoutaverb" }
expects_saf = "SAF_04"
warning = "Van a aparecer el diálogo de certificado y el del PIN antes de que llegue el rechazo."

[check.expect.autofirma]
verdict = "no-conforme"
cause = "BUG-15"
note = "Sin validar cop, signandsave revienta con NullPointerException y reporta SAF_09."

[check.expect.rfirma]
verdict = "conforme"

