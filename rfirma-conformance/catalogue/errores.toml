[[check]]
id = "a_saf_code_reaches_the_published_client_intact_over_the_websocket"
set = "errores"
chapter = "15"
citation = "ProtocolInvocationLauncher.java:700-714; AfirmaWebSocketServerV4.java:91-92; autoscript.js:2310-2340"
statement = """
Un rechazo numerado viaja por el WebSocket en texto plano y llega al cliente publicado con el prefijo
SAF_nn intacto al principio del mensaje, que es lo único por lo que el cliente lo reconoce como
error.
"""
drive = { mode = "v4", script = "signwithanunknownformat" }
expects_saf = "SAF_06"

[[check]]
id = "a_saf_code_reaches_the_published_client_intact_over_the_service_channel"
set = "errores"
chapter = "15"
citation = "CommandProcessorThread.java:333-348, 493-512; autoscript.js:3355-3385"
statement = """
Por el socket local el mismo rechazo viaja en Base64 dentro de una respuesta HTTP 200, y el cliente
