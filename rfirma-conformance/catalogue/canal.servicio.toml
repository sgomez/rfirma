# Las comprobaciones del conjunto «canal.servicio»; sus capítulos y su orden los declara `sets.toml`.

[[check]]
id = "the_service_channel_completes_a_certificate_selection"
set = "canal.servicio"
citation = "ServiceInvocationManager.java:103-169; CommandProcessorThread.java:520-620"
statement = """
El carril del socket local completa una selección de certificado igual que el canal WebSocket: sin
esta comprobación ninguna de las suyas es de fiar.
"""

[check.drive]
mode = "service"
script = "selectcert"
act.consent = "Va a aparecer el diálogo de selección de certificado: elige uno para que la comprobación llegue a medir algo."
expects.completes = {}

[[check]]
id = "the_service_launch_accepts_a_slash_before_its_query"
set = "canal.servicio"
citation = "ProtocolInvocationLauncher.java:264"
statement = """
La invocación afirma://service/? con barra ante la consulta abre el canal igual que
afirma://service?.
"""

[check.drive]
mode = "service"
script = "protocol-service-slash"
expects.completes.conditions = ["the-echo-answers-ok"]

