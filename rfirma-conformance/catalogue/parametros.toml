# Entradas del catálogo de la suite de conformidad para el conjunto «parametros».
# Lo lee `catalogue.rs`, que valida la forma de cada entrada al arrancar.

[[check]]
id = "a_local_file_in_dat_is_refused_with_saf_03"
set = "parametros"
chapter = "02"
citation = "UrlParameters.java:298-304; ProtocolInvocationLauncher.java:736-740"
statement = """
Un dat que empieza por file:/ se rechaza antes de leer nada, con SAF_03: la sede no puede pedir que
se firme un fichero local.
"""
drive = { mode = "v4", script = "protocol-v4-parameters" }
assistance = "none"
condition = "dat-with-a-local-file-saf-03"

[[check]]
id = "gzipped_data_is_decompressed_before_signing"
set = "parametros"
chapter = "02"
citation = "UrlParameters.java:305-315; DataDownloader.java:63-69"
statement = """
Con gzip=true, el dat en Base64 se descomprime antes de operar, y la firma sale sobre los datos
descomprimidos en vez de rechazar la petición.
"""
drive = { mode = "v4", script = "signgzip" }
assistance = "click"
completes = {}
warning = "Va a aparecer el diálogo de certificado."

