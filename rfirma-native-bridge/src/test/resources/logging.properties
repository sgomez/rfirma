# AutoFirma registra a nivel INFO cada prefirma y cada postfirma, y las pruebas
# hacen unas cuantas: sin esto el carril rapido escupe cuarenta lineas de ruido
# por una ejecucion en verde. Los avisos y los errores SI se ven.
handlers = java.util.logging.ConsoleHandler
.level = INFO
java.util.logging.ConsoleHandler.level = ALL
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
es.gob.afirma.level = WARNING
