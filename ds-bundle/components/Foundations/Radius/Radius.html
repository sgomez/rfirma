<!doctype html>
<html lang="es" data-theme="dark"><head><meta charset="utf-8">
<title>Radius - rFirma Design System</title>
<link rel="stylesheet" href="../../../styles.css">
<style>
  body { margin: 0; padding: var(--rf-space-3); }
  .rf-demo-label {
    font-family: var(--rf-font-body); font-size: 11px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase;
    color: var(--rf-text-muted); margin: 0 0 var(--rf-space-1);
  }
  .rf-demo-grid { display: grid; gap: var(--rf-space-2); }
  .rf-radius-box { width:84px; height:84px; background:var(--rf-color-surface);
    border:1px solid var(--rf-border-strong); }
</style>
</head>
<body class="rf-root">

<h2 class="rf-title">Radios</h2>
<div class="rf-row rf-gap-md" style="margin-top:24px; align-items:flex-start">
  <div class="rf-stack rf-gap-xs" style="align-items:center; width:132px">
    <div class="rf-radius-box" style="border-radius:var(--rf-radius-sm)"></div>
    <span class="rf-body">sm &middot; 4px</span>
    <span class="rf-body rf-text-muted" style="text-align:center; line-height:1.4">entradas compactas, chips</span>
  </div>
  <div class="rf-stack rf-gap-xs" style="align-items:center; width:132px">
    <div class="rf-radius-box" style="border-radius:var(--rf-radius-md)"></div>
    <span class="rf-body">md &middot; 6px</span>
    <span class="rf-body rf-text-muted" style="text-align:center; line-height:1.4">botones, tarjetas, campos</span>
  </div>
  <div class="rf-stack rf-gap-xs" style="align-items:center; width:132px">
    <div class="rf-radius-box" style="border-radius:var(--rf-radius-lg)"></div>
    <span class="rf-body">lg &middot; 8px</span>
    <span class="rf-body rf-text-muted" style="text-align:center; line-height:1.4">contenedores mayores</span>
  </div>
  <div class="rf-stack rf-gap-xs" style="align-items:center; width:132px">
    <div class="rf-radius-box" style="border-radius:var(--rf-radius-xl)"></div>
    <span class="rf-body">xl &middot; 16px</span>
    <span class="rf-body rf-text-muted" style="text-align:center; line-height:1.4">di&aacute;logos, hojas modales</span>
  </div>
  <div class="rf-stack rf-gap-xs" style="align-items:center; width:132px">
    <div class="rf-radius-box" style="border-radius:var(--rf-radius-pill)"></div>
    <span class="rf-body">pill &middot; 9999px</span>
    <span class="rf-body rf-text-muted" style="text-align:center; line-height:1.4">insignias, botones p&iacute;ldora</span>
  </div>
</div>

</body></html>
