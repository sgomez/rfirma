# Deja en `main` la cache de Rust mas reciente de cada perfil, antes de que las superadas
# desplacen a las vigentes. Solo se quedan superadas cuando cambian Cargo.lock o el compilador.
name: Caches de Rust superadas

on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * *'

permissions: {}

jobs:
  stale-rust:
    name: Borra las caches de Rust superadas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # La clave acaba en el hash del compilador y el de Cargo.lock: lo anterior es el perfil.
      - name: Deja en refs/heads/main la mas reciente de cada perfil
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref refs/heads/main --key v0-rust- --limit 100 --json id,key,createdAt \
            --jq 'group_by(.key | sub("-[^-]+-[^-]+$"; "")) | .[] | sort_by(.createdAt) | .[:-1][] | .id' \
            | while read -r id; do gh cache delete "$id"; done
