[[check]]
id = "concurrent_service_orders_do_not_share_their_state"
set = "canal.servicio"
citation = "ServiceInvocationManager.java:136-143; CommandProcessorThread.java:67-69"
statement = """
Dos conversaciones simultáneas con el canal no se mezclan los fragmentos ni las partes del resultado
(BUG-09).
"""
unmeasurable = "El protocolo no lleva identificador de conversación: dos conversaciones de la misma sesión intercaladas son una sola en el cable, y ningún cliente puede separarlas. Lo que BUG-09 describe es una carrera entre hilos que atienden a la vez, y desde el cable no se provoca de forma determinista."

[[check]]
