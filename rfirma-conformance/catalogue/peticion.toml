[[check]]
id = "jvc_only_warns_below_one"
set = "peticion"
citation = "ProtocolInvocationLauncher.java:196-214; autoscript.js:27, 4362"
statement = """
jvc sólo avisa de un cliente web antiguo cuando vale menos de 1, y el aviso es un diálogo que no
detiene la operación.
"""
unmeasurable = "El aviso sólo salta con valores que ningún cliente real envía —el publicado manda siempre jvc=3—, y es un diálogo local que no llega al cable."

[[check]]
id = "operation_supported_protocol_version"
