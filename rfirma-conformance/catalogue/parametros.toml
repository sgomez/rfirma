[[check]]
id = "keystore_takes_precedence_over_ksb64"
set = "parametros"
chapter = "02"
citation = "UrlParameters.java:382-412"
statement = """
Si la petición trae keystore y ksb64, el almacén que se abre es el de keystore.
"""
unmeasurable = "El almacén que se abre sólo se ve en la ventana de selección de certificado, y la suite monta un único almacén PKCS#11: nombren lo que nombren los dos parámetros, la persona acaba ante el mismo."

[[check]]
id = "appname_changes_nothing_that_can_be_seen"
set = "parametros"
chapter = "02"
citation = "UrlParametersToSign.java:241-243; UrlParametersForBatch.java:221-223"
statement = """
appname se lee y se guarda, pero ningún consumidor lo usa: no cambia ni la respuesta ni ningún
diálogo.
"""
unmeasurable = "Ningún consumidor lee appname: no deja rastro ni en el cable ni en el trámite, y no hay nada que medir."

[[check]]
id = "jvc_only_warns_below_one"
set = "parametros"
chapter = "02"
citation = "ProtocolInvocationLauncher.java:196-214; autoscript.js:27, 4362"
statement = """
jvc sólo avisa de un cliente web antiguo cuando vale menos de 1, y el aviso es un diálogo que no
detiene la operación.
"""
unmeasurable = "El aviso sólo salta con valores que ningún cliente real envía —el publicado manda siempre jvc=3—, y es un diálogo local que no llega al cable."
