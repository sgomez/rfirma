# Las comprobaciones del conjunto «canal.intermedio»; sus capítulos y su orden los declara `sets.toml`.

[[check]]
id = "the_result_is_uploaded_ciphered_with_the_session_key"
set = "canal.intermedio"
citation = "ProtocolInvocationLauncher.java:370-430; ProtocolInvocationLauncherSelectCert.java:245-257; UrlParameters.java:255, 327-345; autoscript.js:4337-4360, 4833-4840"
statement = """
Por servidor intermedio se completa una selección de certificado: con una key de 8 caracteres
en la petición, la aplicación sube el resultado a stservlet cifrado con ella —cada parte como su
relleno, un punto y el cifrado en Base64— y la sede lo recoge de rtservlet. Sin esta comprobación
ninguna de las suyas es de fiar.
"""

[check.drive]
mode = "relay"
script = "relayselectcert"
patience_secs = 120
greeting = true
act.consent = "Va a aparecer el diálogo de selección de certificado: elige uno."
expects.completes.conditions = ["the-result-uploaded-ciphered"]

[[check]]
id = "active_waiting_announces_wait_every_ten_seconds"
set = "canal.intermedio"
citation = "ActiveWaitingThread.java:14-15, 36-58; ProtocolInvocationLauncher.java:406-409, 855-858"
statement = """
Con aw=true, mientras dura la operación la aplicación sube #WAIT a stservlet cada diez segundos.
"""

[check.drive]
mode = "relay"
script = "relayselectcertslowly"
patience_secs = 180
act.consent = "Va a aparecer el diálogo de selección de certificado: espera unos 25 segundos antes de elegir uno, para que la suite vea varios avisos de espera."
expects.completes.conditions = ["wait-announced-every-ten-seconds"]

[[check]]
id = "a_long_request_is_retrieved_by_fileid"
set = "canal.intermedio"
citation = "ProtocolInvocationLauncher.java:659-676; ProtocolInvocationLauncherUtil.java:52-84; autoscript.js:3894-3903, 4256-4320"
statement = """
Una petición demasiado larga para la URL la sube la sede a stservlet, y la aplicación, invocada con
fileid y rtservlet, la recupera de rtservlet antes de operar.
"""

[check.drive]
mode = "relay"
script = "relay"
patience_secs = 120
act.consent = "Va a aparecer el diálogo de certificado para firmar: elige uno."
expects.completes.conditions = ["the-request-retrieved-by-fileid", "the-signature-verifies"]

[[check]]
id = "a_retriever_error_answers_saf_16"
set = "canal.intermedio"
citation = "ProtocolInvocationLauncherUtil.java:66-70; ProtocolInvocationLauncher.java:663-669"
statement = """
Si rtservlet contesta con un err- a la petición de fileid, la aplicación termina con SAF_16 sin subir
nada a stservlet: el código no llega a la sede, que no recibe respuesta.
"""

[check.drive]
mode = "relay"
script = "relayretrievalfailure"
patience_secs = 120
act.consent = "El servidor intermedio de la suite no entrega la petición: si la aplicación muestra un error, ciérralo."
expects.completes.conditions = ["the-retrieval-failure-not-uploaded"]

[[check]]
id = "each_operation_launches_its_own_process"
set = "canal.intermedio"
citation = "autoscript.js:4337-4360; ProtocolInvocationLauncher.java:870-889"
statement = """
Por servidor intermedio no hay canal que dure: cada operación de la sede invoca de nuevo la
aplicación.
"""

[check.drive]
mode = "relay"
script = "relaytwice"
patience_secs = 180
act.consent = "Va a aparecer dos veces el diálogo de selección de certificado: elige uno cada vez."
expects.completes.conditions = ["each-operation-launched-apart"]

[[check]]
id = "a_saf_code_travels_to_the_intermediate_server_even_before_the_operation_began"
set = "canal.intermedio"
citation = "ProtocolInvocationLauncher.java:601-604, 710-713, 738-743, 870-889"
bug = "BUG-26"
statement = """
Por servidor intermedio el rechazo se sube a stservlet con el prefijo SAF_nn intacto, tanto el de la
operación ya empezada como el de un parámetro que se detecta antes de empezarla (SAF_03): por canal
local ese mismo SAF_03 llega a la sede.
"""

[check.drive]
mode = "relay"
script = "relayrefusals"
patience_secs = 180
act.consent = "La segunda firma lleva un algoritmo que no se admite: la aplicación enseña un error; ciérralo."
expects.completes.conditions = ["a-saf-after-the-start-travels-intact", "a-saf-before-the-start-travels-intact"]

[[check]]
