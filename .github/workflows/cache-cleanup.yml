# Borra las caches que deja una PR al cerrarse, antes de que desplacen a las vigentes.

name: Limpieza de caches

on:
  # `pull_request_target` para que el token pueda borrar tambien en las PR de
  # forks; no se hace checkout de nada, asi que no se ejecuta codigo de la PR.
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    name: Borra las caches de la PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Borra las caches de refs/pull/N/merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          gh cache list --ref "$REF" --limit 100 --json id --jq '.[].id' \
            | while read -r id; do gh cache delete "$id"; done
