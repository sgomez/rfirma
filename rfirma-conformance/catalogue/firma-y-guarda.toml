# Las comprobaciones del conjunto «firma-y-guarda»; sus capítulos y su orden los declara `sets.toml`.

[[check]]
id = "signandsave_saves_the_signature_and_returns_it_to_the_site"
set = "firma-y-guarda"
citation = "ProtocolInvocationLauncherSignAndSave.java:536-566, 1103-1126; NativeSignDataProcessor.java:54-104; UrlParametersToSignAndSave.java:38"
statement = """
signandsave firma con el verbo que declara cop, ofrece guardar el resultado con el nombre que la
petición propone en filename y devuelve además la firma y el certificado a la sede que lo pidió: lo
guardado es lo que recibe la sede.
"""

[check.drive]
mode = "v4"
script = "signandsave"
harness = "the_saved_signature_read_back"
act.save_as_proposed = "Van a aparecer el diálogo de certificado y la petición de dónde guardar la firma: guárdala con el nombre propuesto, challenge-signed.csig, en la carpeta que se abre."
expects.completes.conditions = ["the-returned-signature-on-disk", "the-signature-verifies"]

[[check]]
id = "signandsave_rejects_an_illegal_filename_with_saf_03"
set = "firma-y-guarda"
citation = "UrlParametersToSignAndSave.java:38, 330-341"
statement = """
Un filename con alguno de los caracteres que el sistema de ficheros no admite se rechaza con SAF_03
antes de pedir certificado alguno.
"""

[check.drive]
mode = "v4"
script = "signandsavewithanillegalfilename"
act.consent = "AutoFirma enseña un diálogo de error antes de contestar el rechazo: ciérralo para que llegue la respuesta."
expects.code = "SAF_03"

[[check]]
id = "signandsave_asks_for_the_document_when_the_request_brings_no_data"
set = "firma-y-guarda"
citation = "ProtocolInvocationLauncherSignAndSave.java:293-350; UrlParameters.java:299-319"
statement = """
Una petición de signandsave que llega sin dat ni fileid pide el documento a firmar en vez de
rechazarse, y firma el que se le dé.
"""

[check.drive]
mode = "v4"
script = "signandsavewithoutdata"
harness = "a_document_to_sign"
act.pick_file = "Se va a pedir primero el documento a firmar, y después vendrán el diálogo de certificado y la petición de dónde guardar: elige documento.txt, el preparado, y guarda la firma donde te proponga."
expects.completes = {}

[[check]]
id = "signandsave_cancelled_at_the_save_dialogue_answers_a_cancellation"
set = "firma-y-guarda"
citation = "ProtocolInvocationLauncherSignAndSave.java:556-560; JSEUIManager.java:782-803"
statement = """
Cancelar cuando se pide dónde guardar termina el trámite como cancelación, y así llega a la sede: ni
como error ni como firma entregada.
"""

[check.drive]
mode = "v4"
script = "signandsavecancelled"
act.cancel = "Va a aparecer el diálogo de certificado; cuando se pida dónde guardar, cancela en vez de guardar."
expects.code = "CANCEL"

[[check]]
id = "the_saving_directory_of_the_request_is_where_the_signature_is_saved"
set = "firma-y-guarda"
citation = "ProtocolInvocationLauncherSignAndSave.java:537-553; AfirmaExtraParams.java:36"
statement = """
El directorio inicial que la petición declara en filenameSaveCurrentDir es donde se abre el
guardado del resultado: aceptar lo que propone deja la firma en él.
"""

[check.drive]
mode = "v4"
script = "signandsavewithsavingparameters"
harness = "the_saved_signature_read_back"
act.save_as_proposed = "Van a aparecer el diálogo de certificado y la ventana para guardar la firma: guárdala con el nombre propuesto, challenge-signed.csig, en la carpeta en la que se abra."
expects.completes.conditions = ["the-returned-signature-on-disk"]

[[check]]
id = "signandsave_accepts_an_elliptic_curve_algorithm"
set = "firma-y-guarda"
citation = "UrlParametersToSignAndSave.java:35, 67-77, 280-288; UrlParametersToSign.java:74-77"
explained_by.autofirma = "BUG-05"
statement = """
El catálogo de algoritmos incluye los de curva elíptica, y signandsave los acepta igual que sign.
"""

[check.drive]
mode = "v4"
script = "signandsavewithecdsa"
store = "ec"
act.save_as_proposed = "AutoFirma rechaza el algoritmo de curva elíptica antes de pedir certificado y enseña un diálogo de error: ciérralo para que llegue la respuesta. Si en cambio aparecen el diálogo de certificado, con el único certificado de curva elíptica del almacén ec, y el de guardar la firma, guárdala donde te proponga."
expects.completes.conditions = ["the-signature-verifies"]

[[check]]
id = "signandsave_rejects_a_request_without_a_verb_with_saf_04"
set = "firma-y-guarda"
citation = "UrlParametersToSignAndSave.java:29, 237; ProtocolInvocationLauncherSignAndSave.java:155, 728"
explained_by.autofirma = "BUG-15"
statement = """
Una invocación de signandsave sin cop se rechaza con SAF_04.
"""

[check.drive]
mode = "v4"
script = "signandsavewithoutaverb"
expects.code = "SAF_04"

[[check]]
id = "signandsave_cancelled_at_the_visible_area_answers_saf_43"
set = "firma-y-guarda"
citation = "ProtocolInvocationLauncherSignAndSave.java:177-180, 495-502, 985-1004, 1040"
explained_by.autofirma = "BUG-13"
statement = """
En signandsave, con visibleSignature=want y sin el área en la petición, cancelar el diálogo del área
aborta con SAF_43 como en sign.
"""

[check.drive]
mode = "v4"
script = "signandsavepadesvisible"
act.cancel = "Va a aparecer el diálogo del área visible sobre el PDF: cancélalo sin marcar nada. Si después aparecen el certificado o dónde guardar, cancélalos también."
expects.code = "SAF_43"

[[check]]
id = "signandsave_a_cades_triphase_signature_goes_through_the_server_url_and_is_saved"
set = "firma-y-guarda"
citation = "ProtocolInvocationLauncherSignAndSave.java:258, 536-566, 578-588, 722-737; AOSignerFactory.java:53; AOCAdESTriPhaseSigner.java:239-356; PreSigner.java:64-85; PostSigner.java:41-82; JSEUIManager.java:808-814"
statement = """
En signandsave, una firma CAdEStri hace la prefirma y la postfirma contra el serverUrl de properties
con cop=sign y format=CAdES, firma con la clave del certificado la prefirma que le devuelve, y la
firma de la postfirma es la que guarda en disco y la que entrega a la sede.
"""

[check.drive]
mode = "v4"
script = "signandsavecadestri"
harness = "the_saved_signature_read_back"
act.save_as_proposed = "Van a aparecer el diálogo de certificado y la petición de dónde guardar la firma: guárdala con el nombre propuesto, challenge-signed.csig, en la carpeta que se abre."
expects.completes.conditions = ["through-the-triphase-server", "the-presignature-signed-with-the-key", "the-server-signature-as-it-came", "the-returned-signature-on-disk"]
