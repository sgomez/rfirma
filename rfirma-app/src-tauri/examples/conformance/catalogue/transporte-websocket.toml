# Entradas del catálogo de la suite de conformidad para el conjunto «transporte.websocket».
# Repartido por `catalogue.rs`; la forma de cada entrada la vigila la guarda
# `conformance_catalogue_is_sound.rs`.

[[check]]
id = "v4_ports_negotiation"
suite = "transporte.websocket"
chapter = "05"
citation = "ProtocolInvocationLauncher.java:233-236, 976-990; AfirmaWebSocketServerManager.java:64-90"
statement = """
El cliente JavaScript selecciona 3 puertos aleatorios únicos (ports=p1,p2,p3) y el servidor enlaza
el primer puerto libre de la lista.
"""
drive = { mode = "v4", script = "protocol-v4" }

[check.expect.autofirma]
verdict = "conforme"

[check.expect.rfirma]
verdict = "conforme"

