warning = "Se va a pedir primero el documento a firmar, y después vendrán el diálogo de certificado, el del PIN y la petición de dónde guardar: elige el documento preparado y completa el resto."

[check.expect.autofirma]
verdict = "conforme"

[check.expect.rfirma]
verdict = "conforme"

[[check]]
id = "signandsave_cancelled_at_the_save_dialogue_answers_a_cancellation"
suite = "operaciones.disco"
chapter = "07"
citation = "ProtocolInvocationLauncherSignAndSave.java:556-560; JSEUIManager.java:782-803"
statement = """
Cancelar cuando se pide dónde guardar termina el trámite como cancelación, y así llega a la sede: ni
como error ni como firma entregada.
"""
drive = { mode = "v4", script = "signandsave" }
harness = "cancelled_dialogue"
needs = ["persona"]
question = "¿se canceló al pedirse dónde guardar? [s/n]"
warning = "Van a aparecer el diálogo de certificado y el del PIN; cuando se pida dónde guardar, cancela en vez de guardar."

[check.expect.autofirma]
verdict = "conforme"

[check.expect.rfirma]
verdict = "conforme"

[[check]]
id = "the_saving_parameters_of_the_request_configure_the_saving_of_the_signature"
suite = "operaciones.disco"
chapter = "07"
citation = "ProtocolInvocationLauncherSignAndSave.java:537-553; AfirmaExtraParams.java:30, 33, 36"
statement = """
Las extensiones, la descripción y el directorio inicial que la petición declara en filenameSaveExts,
filenameSaveDescription y filenameSaveCurrentDir configuran el guardado del resultado.
"""
unmeasurable = "Los tres sólo cambian el filtro, el rótulo y el directorio de partida del guardado: no viajan por el cable ni cambian ningún evento del cliente publicado, y quien ejecuta la tanda no puede afirmar sobre ellos sin describir la ventana."

[check.expect.autofirma]
verdict = "no-observable"

[check.expect.rfirma]
verdict = "no-observable"

