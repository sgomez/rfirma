# Las comprobaciones del conjunto «canal.intermedio»; sus capítulos y su orden los declara `sets.toml`.

[[check]]
id = "a_saf_code_travels_to_the_intermediate_server_only_once_the_operation_began"
set = "canal.intermedio"
citation = "ProtocolInvocationLauncher.java:601-604, 710-713, 870-889"
statement = """
Por servidor intermedio el rechazo se sube a stservlet con el prefijo SAF_nn intacto. Los que se
detectan antes de empezar la operación —SAF_01, SAF_02, SAF_03, SAF_04, SAF_13, SAF_14, SAF_15 y
SAF_16— no llegan a subirse, y la sede los percibe como una aplicación que no está instalada
(BUG-26).
"""
unmeasurable = "La suite no monta el StorageService al que el cliente subiría el mensaje: el transporte por servidor intermedio queda para más adelante."

[[check]]
id = "the_intermediate_server_failures_answer_their_own_codes"
set = "canal.intermedio"
citation = "ProtocolInvocationLauncher.java:313-320, 883; ProtocolInvocationLauncherSign.java:198-202"
statement = """
Los fallos propios del servidor intermedio tienen su código: SAF_16 si no se recuperan los datos de
rtservlet, SAF_15 si no se descifran con key, SAF_12 si no se cifra el resultado y SAF_11 si no se
puede subir.
"""
unmeasurable = "La suite no monta ni el RetrieveService ni el StorageService con los que fallaría el cliente: el transporte por servidor intermedio queda para más adelante."

[[check]]
id = "the_storage_servlet_is_validated_like_the_retrieve_servlet"
set = "canal.intermedio"
citation = "UrlParametersToSign.java:254-275; ProtocolInvocationLauncher.java:651"
statement = """
stservlet se valida con las mismas reglas que rtservlet —esquema http o https, host no local y sin
parámetros propios— cuando la operación viaja por servidor intermedio.
"""
unmeasurable = "El original sólo lo valida cuando la operación viaja por servidor intermedio: por WebSocket ni lo lee, y la suite no monta el StorageService al que se subiría el rechazo."

[[check]]
id = "the_batch_result_reaches_the_site_through_the_intermediate_server"
set = "canal.intermedio"
citation = "ProtocolInvocationLauncherBatch.java:196-218"
statement = """
Invocado por servidor intermedio, el resultado del lote se sube a stservlet con el id de la sesión,
y un fallo al subirlo es SAF_11.
"""
unmeasurable = "Es del transporte por servidor intermedio, que queda para más adelante: la suite no monta el StorageService al que el cliente subiría el resultado."
