# Las comprobaciones del conjunto «lote»; sus capítulos y su orden los declara `sets.toml`.

[[check]]
id = "a_remote_batch_is_signed_through_the_presigner_and_the_postsigner"
set = "lote"
citation = "BatchSigner.java:340-443; ProtocolInvocationLauncherBatch.java:400-422"
statement = """
Un lote remoto se firma en tres fases contra los servlets que declara la petición: el prefirmador
en batchpresignerurl y el postfirmador en batchpostsignerurl.
"""
drive = { mode = "v4", script = "batch" }
assistance = "click"
condition = "through-both-servlets"
warning = "Va a aparecer el diálogo de certificado: la sede hace de prefirmador y de postfirmador del lote."

