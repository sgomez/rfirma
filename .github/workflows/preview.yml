# Reconstruir un preview es quitar la etiqueta `preview` y volver a ponerla: un push no lo reconstruye.
name: Preview

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  build:
    if: github.event.label.name == 'preview'
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  platforms:
    name: Plataformas del manifiesto
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Descarga los paquetes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.packages-artifact }}
          path: ${{ runner.temp }}/paquetes

      - name: Lista las plataformas
        id: list
        run: |
          set -euo pipefail
          list="$(scripts/packages-manifest.sh platforms "${{ runner.temp }}/paquetes" | jq -Rsc 'split("\n") | map(select(. != ""))')"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  upload:
    name: Paquetes de ${{ matrix.platform }}
    needs: [build, platforms]
    if: needs.platforms.outputs.list != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Descarga los paquetes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.packages-artifact }}
          path: ${{ runner.temp }}/paquetes

      - name: Separa los paquetes de la plataforma
        run: |
          set -euo pipefail
          destino="${{ runner.temp }}/plataforma"
          mkdir -p "$destino"
          while IFS= read -r paquete; do
            cp -- "${{ runner.temp }}/paquetes/$paquete" "$destino/"
          done < <(scripts/packages-manifest.sh platform-files "${{ runner.temp }}/paquetes" "${{ matrix.platform }}")
          (cd "$destino" && sha256sum -- * > SHA256SUMS)

      - name: Sube los paquetes de la plataforma
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rfirma-preview-${{ matrix.platform }}
          path: ${{ runner.temp }}/plataforma/
          retention-days: 14
          if-no-files-found: error
