# La matriz de happy paths: cada celda operación × formato × canal × clave cubierta por una
# comprobación, no aplicable con su motivo o hueco declarado. Solo se exigen las celdas de sus planos;
# un eje que el plano no recorre, y el que una celda no nombra, toma el valor del origen.

origin = { operation = "sign", format = "CAdES", channel = "v4", key = "rsa-sha256" }

channel = ["v4", "v3", "service", "relay"]

[[operation]]
name = "sign"
signs = true

[[operation]]
name = "cosign"
signs = true

[[operation]]
name = "countersign"
signs = true

[[operation]]
name = "signandsave"
signs = true

[[operation]]
name = "save"
signs = false

[[operation]]
name = "batch"
signs = true

[[format]]
name = "CAdES"
verified_by = "the-signature-verifies"

[[format]]
name = "XAdES"
verified_by = "the-signature-verifies"

[[format]]
name = "PAdES"
verified_by = "the-signature-verifies"

[[format]]
name = "FacturaE"
verified_by = "the-signature-verifies"

[[format]]
name = "CAdEStri"
verified_by = "the-presignature-signed-with-the-key"

[[format]]
name = "XAdEStri"
verified_by = "the-presignature-signed-with-the-key"

[[format]]
name = "PAdEStri"
verified_by = "the-presignature-signed-with-the-key"

[[format]]
name = "FacturaEtri"
verified_by = "the-presignature-signed-with-the-key"

[[key]]
name = "rsa-sha256"
store = "rsa"

[[key]]
name = "rsa-sha384"
store = "rsa"

[[key]]
name = "rsa-sha512"
store = "rsa"

[[key]]
name = "ec-sha256"
store = "ec"

[[key]]
name = "pkcs11-rsa-sha256"
store = "token"

[[plane]]
operation = ["sign", "cosign", "countersign"]
format = "*"

[[plane]]
operation = "*"
channel = "*"

[[plane]]
format = ["CAdES", "XAdES", "PAdES", "FacturaE"]
key = "*"

