[package]
name = "rfirma-probe"
version = "0.0.1"
edition = "2021"
description = "Sonda desechable: mide el flatpak del issue #22. No es rfirma."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
cryptoki = "0.10"
base64 = "0.22"

[profile.release]
strip = true
