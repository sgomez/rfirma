[package]
name = "rfirma"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "rfirma: firma y cofirma de PDFs en PAdES con firma visible."
license = "EUPL-1.2"
publish = false

# El binario se llama igual que `command:` en el manifiesto flatpak
# (packaging/flatpak/me.sgomez.rfirma.yml). Si cambias uno, cambia el otro.
[[bin]]
name = "rfirma"
path = "src/main.rs"

[lib]
name = "rfirma_lib"
path = "src/lib.rs"

[features]
# NO LA QUITES, Y NO LA PONGAS POR OMISION.
#
# El `dev` de Tauri es literalmente `!custom-protocol` (build.rs del crate
# tauri): sin esta bandera, `cargo build --release` produce un binario que
# apunta la ventana a `devUrl` —http://localhost:1420— en vez de servir el
# frontal empotrado, y el flatpak abre con "Could not connect to localhost".
# La activa `cargo tauri build`, que aqui NO se usa (ID-05: bundle.active es
# false y el binario lo instala el manifiesto flatpak), asi que la pasan a mano
# la receta `build-rust` del justfile y el modulo `rfirma-app` del manifiesto.
#
# Por omision NO, porque entonces `just dev` (`tauri dev`) serviria los assets
# empotrados en vez del servidor de vite y el recargado en caliente moriria.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
# ADR-0013: build.rs se queda en tauri_build::build(). No invoca a Maven ni a
# native-image jamás; de eso se encarga `just native`.
tauri-build = { version = "2", features = [] }

[dependencies]
# El unico sitio del programa que toca la clave privada (ADR-0001). Habla con el
# modulo PKCS#11 del sistema; no trae criptografia propia.
cryptoki = "0.12"
# La rúbrica se normaliza en Rust (ADR-0012): sin este crate la lista de
# formatos volvería a congelarse en el comando de native-image. Solo PNG y
# JPEG: cada decodificador de más es superficie sobre un fichero que elige el
# usuario, y ni un TIFF ni un WebP aparecen en una firma escaneada.
# Carga la libreria nativa con dlopen por una ruta relativa al ejecutable
# (ID-10). No hay `#[link]` ni `build.rs` que enlace nada: la libreria no esta
# presente al compilar, y encadenarla al build son 1 m 22 s de native-image en
# cada `cargo build` (ADR-0013).
libloading = "0.8"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# La rúbrica viaja al puente en Base64 dentro de `signatureRubricImage`, así
# que la normalización entrega ya esa cadena y nadie la vuelve a codificar mal.
base64 = "0.22"
# El identificador opaco de un documento abierto sale de aqui y no de un
# amasado de `RandomState` (ID-61): `std` siembra sus claves una vez por hilo y
# cada `RandomState::new()` posterior incrementa una, asi que los
# identificadores de una sesion salian todos de la misma semilla mas un
# contador. Ya estaba en el arbol como dependencia transitiva; aqui solo se
# hace directa.
getrandom = "0.3"
# La memoria entre sesiones son dos ficheros JSON (ADR-0010), asi que serde
# entra aqui y no con el primer #[tauri::command]: el formato de configuracion
# y estado lo escribe este modulo, no la interfaz.
serde = { version = "1", features = ["derive"] }
# JSON en los dos ficheros porque los escribe la aplicacion y nadie los edita a
# mano (ADR-0010). Se lee primero a `Value` para mirar la "version" antes de
# deserializar: un fichero de una version futura se aparta, no se interpreta.
serde_json = "1"
tauri = { version = "2", features = [] }
# El diálogo de fichero se abre desde Rust y no desde el frontal (ID-63): así
# la ventana sigue con un solo fichero que conoce `invoke` y la lista de
# permisos de `capabilities/default.json` no crece, porque los permisos de
# Tauri v2 vigilan lo que la ventana puede pedir, no lo que Rust hace.
tauri-plugin-dialog = "2"
# Abrir el PDF firmado y su carpeta, que bajo el sandbox es la unica forma
# que tiene el usuario de llegar al fichero: nunca ve la ruta (ADR-0011).
# Debajo es el portal `OpenURI`, y la llamada sale de Rust como la del
# dialogo (ID-63, ID-85).
tauri-plugin-opener = "2"
# Instancia unica (ID-160): la segunda invocacion no abre otro proceso, se la
# entrega a la ventana que ya estaba. Dos procesos escribiendo `state.json` y
# `recents.json` acaban con el ultimo en cerrar pisando al otro, y el `.deb`
# quita el aislamiento del flatpak que hoy lo tapa a medias.
tauri-plugin-single-instance = "2"
# La CA local y el certificado del servidor local: generarlos y firmar el
# segundo con la primera (ID-225). Se descarto `rcgen` porque arrastra `ring`, y
# `x509-cert` —que ya esta aqui para LEER certificados— porque obligaria a
# firmar con RSA en Rust. Ya estaba en el arbol como dependencia transitiva de
# `native-tls`; aqui solo se hace directa, asi que `Cargo.lock` cambia en una
# sola linea y `cargo-sources.json` no se toca.
openssl = "0.10"
# Solo para leer del certificado el titular y las fechas de validez. Un
# certificado caducado se rechaza ANTES de pedir el PIN, y para eso hay que
# saber leer su notAfter.
x509-cert = "0.3"
# El `Sink` y el `Stream` del socket: `tokio-tungstenite` los expone pero no
# reexporta el rasgo, asi que hace falta nombrarlo. Ya estaba en el arbol como
# dependencia transitiva; aqui solo se hace directa.
# Quien de verdad sabe si `afirma://` tiene manejador registrado (ID-240): la
# API de GIO, no una llamada a `xdg-mime` por linea de comandos. Ya estaba en
# el arbol como dependencia transitiva de tauri (via el GTK que trae
# webkit2gtk); aqui solo se hace directa.
gio = "0.18"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# El transporte del canal: un servidor WebSocket sobre TLS en 127.0.0.1
# (ID-212). Las caracteristicas de TLS de este crate son SOLO de cliente, asi
# que el servidor va con `handshake` y nada mas: `accept_async` recibe el
# stream ya cifrado. Nada de `rustls`: seria una segunda pila de TLS en el
# mismo binario (ID-217).
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
] }
# El servidor no posee su runtime (ID-213): es una `async fn` que en produccion
# corre sobre `tauri::async_runtime` y en pruebas sobre `#[tokio::test]`. Ya
# estaba en el arbol como dependencia transitiva de tauri; aqui solo se hace
# directa.
tokio = { version = "1", features = ["net", "rt", "sync", "io-util", "macros"] }
# El saludo TLS del servidor local, sobre el OpenSSL del sistema que ya usa
# `reqwest`. Ya estaban las dos en el arbol; aqui solo se hacen directas.
native-tls = "0.2"
tokio-native-tls = "0.3"
# La comprobacion de version nueva, y el UNICO sitio del programa que abre una
# conexion (ID-182). Entra con `default-features = false` a proposito: las de
# por omision traen rustls con aws-lc-rs —que exige cmake en la construccion del
# flatpak— y `native-tls` usa el OpenSSL que ya trae tanto el anfitrion como
# org.gnome.Sdk. Sin `json`: quien interpreta la respuesta es el caso de uso,
# no el cliente HTTP.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "native-tls",
] }

[dev-dependencies]
# El cliente de canal y las pruebas del servidor abren sockets de verdad
# (grada B): hace falta un runtime con hilos y el `#[tokio::test]`.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# El cliente de canal habla `wss://` de verdad: aqui si se usa la pila de TLS
# de cliente del crate, que es la unica que trae.
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
# Las pruebas del almacén de la rúbrica escriben de verdad en disco: copiar es
# justo el comportamiento que se prueba, y sobre un disco simulado no se
# probaría nada.
tempfile = "3"
# Verifica en las pruebas la firma que devuelve el token, sin montar el
# ensamblado PAdES entero (docs/research/pkcs11-mecanismo-firma.md, punto 5).
# Solo de pruebas: rfirma no hace criptografia RSA en Rust, la delega en el token.
rsa = "0.9"
# La bandera `oid` es la que hace que la verificacion use el envoltorio
# DigestInfo de PKCS#1 v1.5. Sin ella `rsa` no acepta Sha256 como digest con
# prefijo, que es justo lo que el ID-16 exige contrastar.
sha2 = { version = "0.10", features = ["oid"] }

[profile.release]
strip = true
