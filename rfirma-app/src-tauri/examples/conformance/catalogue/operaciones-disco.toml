harness = "automatic_certificate_selection"
needs = ["persona"]
question = "¿se pidió elegir certificado? [s/n]"
warning = "La exigencia presupone un único certificado utilizable en el almacén de la tanda: relánzala con `--store` apuntando a uno que sólo tenga ese. Si al ejecutarla aparece la lista con varios candidatos, la premisa no se cumple: cancela y deja la respuesta en blanco para que la comprobación quede pendiente en vez de condenar al sujeto."

[check.expect.autofirma]
verdict = "conforme"

[check.expect.rfirma]
verdict = "conforme"

