drive = { mode = "v4", script = "signandsave" }
harness = "proposed_save_name"
needs = ["persona"]
question = "¿el nombre ofrecido para guardar era «challenge-signed.csig»? [s/n]"
warning = "Van a aparecer el diálogo de certificado y el del PIN; cuando se pida dónde guardar, mira qué nombre viene propuesto antes de completarlo."

[check.expect.autofirma]
verdict = "conforme"

[check.expect.rfirma]
verdict = "conforme"

