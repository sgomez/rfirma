# Cargo fuera: mover Cargo.lock obliga a regenerar a mano las fuentes del flatpak (ADR-0013).
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      acciones:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - needs-triage
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns:
          - '*'
    commit-message:
      prefix: 'build(deps)'
    labels:
      - needs-triage
