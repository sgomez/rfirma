[[check]]
id = "a_cipher_key_of_eight_characters_but_not_eight_bytes_answers_saf_03"
set = "canal.intermedio"
citation = "UrlParameters.java:327-344; DesCipher.java:37; ProtocolInvocationLauncherSign.java:198-202; ProtocolInvocationLauncher.java:697-713"
bug = "BUG-34"
statement = """
Una key de ocho caracteres que no son ocho bytes no sirve como clave DES: se rechaza con SAF_03 antes
de pedir el certificado, y no se firma para acabar en un SAF_12 sin cifrar.
"""

[check.drive]
mode = "relay"
script = "relayuncipherable"
patience_secs = 120
act.consent = "Puede aparecer un diálogo de certificado o uno de error: si pide certificado, elige uno; si muestra un error, fíjate en su código antes de cerrarlo."
expects.code = "SAF_03"

[[check]]
