warning = "La sede pide el almacén PKCS#11 de SoftHSM: si te pide el PIN, es 1234, y elige cualquiera de los certificados que ofrezca. AutoFirma pide el PIN al abrir el token, antes de la lista; otro cliente puede pedirlo después de elegir."

