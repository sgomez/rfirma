[package]
name = "rfirma-conformance"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Suite de conformidad del protocolo afirma:// para AutoFirma y rFirma."
license = "EUPL-1.2"
publish = false

[dependencies]
base64 = "0.22"
getrandom = "0.3"
openssl = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
