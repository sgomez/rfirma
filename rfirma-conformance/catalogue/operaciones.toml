# Entradas del catálogo de la suite de conformidad para el conjunto «operaciones».
# Lo lee `catalogue.rs`, que valida la forma de cada entrada al arrancar.

[[check]]
id = "save_answers_a_confirmation_the_published_client_recognises"
set = "operaciones"
chapter = "10"
citation = "CommandProcessorThread.java:290-305; AfirmaWebSocketServer.java:113; JSEUIManager.java:695-838"
statement = """
save pide destino y responde una confirmación de guardado que el cliente publicado reconoce como
tal, no como una firma.
"""
drive = { mode = "v4", script = "save" }
assistance = "person"
harness = "save_confirmation"
question = "¿se pidió elegir dónde guardar el fichero? [s/n]"
warning = "Va a aparecer la ventana nativa para elegir dónde guardar el fichero."

[[check]]
id = "signandsave_accepts_an_elliptic_curve_algorithm"
set = "operaciones"
chapter = "07"
citation = "UrlParametersToSignAndSave.java:35, 67-77, 280-288; UrlParametersToSign.java:74-77"
statement = """
El catálogo de algoritmos incluye los de curva elíptica, y signandsave los acepta igual que sign.
"""
drive = { mode = "v4", script = "signandsavewithecdsa" }
assistance = "person"
store = "ec"
warning = "Van a aparecer el diálogo de certificado, con el único certificado de curva elíptica del almacén ec, y el de guardar la firma: guárdala donde te proponga."

[[check]]
id = "a_signature_that_requests_a_timestamp_carries_it_or_reports_the_failure"
set = "operaciones"
chapter = "12"
citation = "AOCAdESSigner.java:543-550, 576-579; XAdESTspUtil.java:82-84"
statement = """
Si la petición pide sello de tiempo, la firma que vuelve lo lleva; si no se pudo sellar, la
operación lo reporta en vez de devolver una firma sin sello.
"""
drive = { mode = "v4", script = "signwithbrokentsa" }
assistance = "click"
harness = "timestamp_in_the_signature"
warning = "Va a aparecer el diálogo de certificado."

[[check]]
id = "selectcert_only_offers_certificates_with_a_private_key"
set = "operaciones"
chapter = "09"
citation = "ProtocolInvocationLauncherSelectCert.java:178, 193; KeyStoreUtilities.java:248"
statement = """
selectcert filtra los certificados sin clave privada en el almacén (checkPrivateKeys=true) y, en un
token que exija autenticación, puede pedir el PIN antes de devolver el certificado.
"""
drive = { mode = "v4", script = "selectcert" }
assistance = "person"
store = "token"
harness = "private_key_check"
question = "¿se pidió el PIN del token/certificado? [s/n]"
warning = "Van a aparecer el diálogo de selección de certificado y, si el cliente exige clave privada, el del PIN."
