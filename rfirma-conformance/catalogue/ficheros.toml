# Las comprobaciones del conjunto «ficheros»; sus capítulos y su orden los declara `sets.toml`.

[[check]]
id = "save_rejects_an_illegal_filename_with_saf_03"
set = "ficheros"
citation = "UrlParametersToSave.java:27, 207-219"
statement = """
Un filename con alguno de los caracteres que el sistema de ficheros no admite se rechaza con SAF_03
antes de pedir destino alguno.
"""
drive = { mode = "v4", script = "savewithanillegalfilename" }
assistance = "none"
saf = "SAF_03"

[[check]]
id = "save_confirms_before_writing_over_a_file_that_already_exists"
set = "ficheros"
citation = "JSEUIManager.java:781-803; ProtocolInvocationLauncherSave.java:79-91"
statement = """
Elegir como destino un fichero que ya existe pide confirmación antes de escribir encima, y sólo
escribe si se confirma.
"""
drive = { mode = "v4", script = "save" }
assistance = "person"
harness = "a_file_to_overwrite"
question = "¿se pidió confirmación al elegir un fichero que ya existía? [s/n]"
person = { yes = "se pidió confirmación antes de escribir sobre el fichero que ya estaba", no = "se escribió sobre el fichero que ya estaba sin pedir confirmación", yes_means = "conforme" }
warning = "Se va a pedir dónde guardar: acepta el nombre propuesto, challenge.bin, que ya existe porque se ha preparado, y acepta la confirmación que venga después."

[[check]]
id = "the_declared_extensions_filter_what_the_saving_offers"
set = "ficheros"
citation = "ProtocolInvocationLauncherSave.java:79-91; UrlParametersToSave.java:30, 221-233, 242-258"
statement = """
Las extensiones que la petición declara en exts, con la descripción de desc, filtran lo que el
guardado ofrece.
"""
unmeasurable = "El filtro de extensiones vive en la ventana de guardado y no deja rastro en el cable: el cliente publicado recibe la misma confirmación se filtre o no, y quien ejecuta la suite no puede afirmar sobre él sin describir la ventana."

[[check]]
id = "load_answers_the_name_of_the_chosen_file_next_to_its_content"
set = "ficheros"
citation = "ProtocolInvocationLauncherLoad.java:95-103, 132-139; UrlParametersToLoad.java:27, 179-191"
statement = """
load pide qué fichero cargar y responde su nombre junto a su contenido, separados por el delimitador
que el protocolo fija.
"""
drive = { mode = "v4", script = "load" }
assistance = "person"
condition = "the-name-next-to-the-content"
harness = "files_to_load"
question = "¿se pidió elegir el fichero a cargar? [s/n]"
person = { yes = "se pidió elegir qué fichero cargar", no = "no se pidió elegir qué fichero cargar", yes_means = "conforme" }
warning = "Se va a pedir qué fichero cargar: elige uno de los preparados para que la comprobación llegue a medir algo."

[[check]]
id = "multiload_answers_every_chosen_file_apart"
set = "ficheros"
citation = "UrlParametersToLoad.java:21, 165-170; ProtocolInvocationLauncherLoad.java:132-139"
statement = """
Con multiload, la carga admite elegir varios ficheros y la respuesta trae cada uno con su nombre y
su contenido, separados por el delimitador que el protocolo fija.
"""
drive = { mode = "v4", script = "multiload" }
assistance = "person"
condition = "every-file-apart"
harness = "files_to_load"
question = "¿se pudieron elegir varios ficheros a la vez? [s/n]"
person = { yes = "se pudieron elegir varios ficheros a la vez", no = "no se pudieron elegir varios ficheros a la vez", yes_means = "conforme" }
warning = "Se va a pedir qué ficheros cargar: elige a la vez los dos preparados para que la comprobación llegue a medir la selección múltiple."

[[check]]
id = "save_answers_a_confirmation_the_published_client_recognises"
set = "ficheros"
citation = "CommandProcessorThread.java:290-305; AfirmaWebSocketServer.java:113; JSEUIManager.java:695-838"
statement = """
save pide destino y responde una confirmación de guardado que el cliente publicado reconoce como
tal, no como una firma.
"""
drive = { mode = "v4", script = "save" }
assistance = "person"
saf = "SAVE_OK"
question = "¿se pidió elegir dónde guardar el fichero? [s/n]"
person = { yes = "se pidió dónde guardar el fichero", no = "no se pidió dónde guardar el fichero", yes_means = "conforme" }
warning = "Va a aparecer la ventana nativa para elegir dónde guardar el fichero."

[[check]]
id = "the_disk_failures_answer_their_own_codes"
set = "ficheros"
citation = "ProtocolInvocationLauncherSave.java:102; ProtocolInvocationLauncherSignAndSave.java:563; ProtocolInvocationLauncherLoad.java:143"
statement = """
Un fallo de escritura al guardar sale con SAF_05, y uno de lectura al cargar, con SAF_25.
"""
unmeasurable = "Los dos fallan después de que la persona elija el fichero, y hacerlos fallar exige un disco que rechace la escritura o la lectura del fichero ya elegido, que la suite no simula."
