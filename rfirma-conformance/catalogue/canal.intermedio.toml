[[check]]
id = "a_result_that_cannot_be_ciphered_answers_saf_12"
set = "canal.intermedio"
citation = "UrlParameters.java:327-344; DesCipher.java:37; ProtocolInvocationLauncherSign.java:198-202; ProtocolInvocationLauncher.java:697-713"
statement = """
Una key de ocho caracteres que no son ocho bytes pasa la validación de la petición, pero el resultado
no se puede cifrar con ella: la aplicación sube SAF_12 sin cifrar y la sede lo recibe.
"""
drive = { mode = "relay", script = "relayuncipherable" }
assistance = "click"
patience_secs = 120
saf = "SAF_12"
warning = "Va a aparecer el diálogo de certificado."

[[check]]
id = "the_storage_servlet_is_validated_like_the_retrieve_servlet"
set = "canal.intermedio"
citation = "UrlParametersToSign.java:254-275; UrlParameters.java:369-374; ProtocolInvocationLauncher.java:731-737"
statement = """
Cuando la operación viaja por servidor intermedio, stservlet se valida como rtservlet: uno en el
