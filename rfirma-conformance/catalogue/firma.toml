# Las comprobaciones del conjunto «firma»; sus capítulos y su orden los declara `sets.toml`.

[[check]]
id = "sign_is_dispatched_as_a_first_signature"
set = "firma"
citation = "ProtocolInvocationLauncher.java:643-646; SignOperation.java:67-78; ProtocolInvocationLauncherSign.java:158"
statement = """
El verbo sign se reconoce como primera firma y la operación se despacha con él: la firma que vuelve
tiene un solo firmante y ninguna contrafirma.
"""

[check.drive]
mode = "v4"
script = "signcades"
greeting = true
act.consent = "Va a aparecer el diálogo de certificado."
expects.completes.conditions = ["a-single-signer", "the-signature-verifies"]

[[check]]
id = "countersign_with_target_tree_countersigns_every_node"
set = "firma"
citation = "ProtocolInvocationLauncher.java:643-646; SignOperation.java:67-78; ProtocolInvocationLauncherSign.java:723-724; CAdESExtraParams.java"
statement = """
El verbo countersign se reconoce como contrafirma y contrafirma la firma previa, y con target=tree
alcanza a todos los nodos del árbol de firmantes: sobre un firmante ya contrafirmado, contrafirma
al firmante y a su contrafirma.
"""

[check.drive]
mode = "v4"
script = "countersigncadestree"
act.consent = "Va a aparecer el diálogo de certificado."
expects.completes.conditions = ["every-node-countersigned", "the-signature-verifies"]

[[check]]
id = "countersign_with_another_target_countersigns_only_the_leaves"
set = "firma"
citation = "ProtocolInvocationLauncherSign.java:723-724; CAdESExtraParams.java"
statement = """
Un target que no es tree se resuelve como las hojas: sobre un firmante ya contrafirmado, sólo la
contrafirma, que es la hoja, recibe una contrafirma nueva.
"""

[check.drive]
mode = "v4"
script = "countersigncadesanothertarget"
act.consent = "Va a aparecer el diálogo de certificado."
expects.completes.conditions = ["only-the-leaves-countersigned", "the-signature-verifies"]

[[check]]
id = "cosign_over_a_xades_signature_adds_a_parallel_signer"
set = "firma"
citation = "ProtocolInvocationLauncherSign.java:710-717; XAdESCoSigner.java"
statement = """
La cofirma de una firma XAdES añade un firmante en paralelo al previo: el XML que vuelve lleva
las dos Signature, ninguna contrafirma de la otra, y cada una verifica con la clave de su firmante.
"""

[check.drive]
