# Puerta automatica del repositorio: `just check` repartido en un job por cadena (ADR-0014).
# El PR y el push a main corren lo que sus ficheros afectan; Windows y macOS, en main, los corre nightly.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Todos los carriles, Windows y macOS incluidos: mantiene calientes sus caches aunque main no se mueva.
    - cron: '17 4 * * 1'

permissions:
  contents: read

# Solo en PR: en main cada commit merece su ejecucion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # CARRIL RAPIDO
  # ==========================================================================
  # Cada job instala SOLO lo de su cadena. Los tres arrancan a la vez, asi que
  # la espera es la del mas lento (Rust) y no la suma.

  # --------------------------------------------------------------------------
  # En un PR sin 'ci-full' y en un push a main, un carril de Linux se salta solo
  # si scripts/ci-lanes.sh prueba que ningun fichero lo afecta. Windows y macOS
  # corren en un PR solo si algun fichero les concierne, y nunca en un push.
  scope:
    name: Alcance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      java: ${{ steps.lanes.outputs.java }}
      web: ${{ steps.lanes.outputs.web }}
      rust: ${{ steps.lanes.outputs.rust }}
      native: ${{ steps.lanes.outputs.native }}
      landing: ${{ steps.lanes.outputs.landing }}
      windows: ${{ steps.lanes.outputs.windows }}
      macos: ${{ steps.lanes.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/ci-lanes.sh
            scripts/platform-files.sh
            rfirma-app/src-tauri/**/*.rs
          sparse-checkout-cone-mode: false

      - name: Decide que carriles corren
        id: lanes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full') }}
          WINDOWS: ${{ contains(github.event.pull_request.labels.*.name, 'ci-windows') }}
          MACOS: ${{ contains(github.event.pull_request.labels.*.name, 'ci-macos') }}
          BEFORE: ${{ github.event.before }}
        run: |
          : > files
          scripts/platform-files.sh > platform-files
          options=(--platform-files platform-files)
          platform_skip="omitido, ningun fichero toca esta plataforma"
          labels=""
          case "$EVENT" in
            pull_request)
              [ "$WINDOWS" != true ] || { options+=(--force windows); labels="$labels ci-windows"; }
              [ "$MACOS" != true ] || { options+=(--force macos); labels="$labels ci-macos"; }
              if [ "$FULL" = true ]; then
                reason="etiqueta ci-full"
              elif [ "$CHANGED_FILES" -ge 3000 ]; then
                reason="$CHANGED_FILES ficheros, mas de los que lista la API"
              elif ! gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
                  --jq '.[] | .filename, (.previous_filename // empty)' > files; then
                : > files
                reason="la API no dio la lista de ficheros"
              else
                reason="ficheros del PR"
              fi
              ;;
            push)
              options+=(--no-platforms)
              platform_skip="omitido en un push, lo cubre la nocturna (nightly.yml)"
              if [[ "$BEFORE" =~ ^0*$ ]]; then
                reason="push sin commit anterior"
              elif ! gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" > compare.json; then
                reason="la API no dio la comparacion"
              elif [ "$(jq '.files // [] | length' compare.json)" -ge 300 ]; then
                reason="300 ficheros o mas, mas de los que lista la API"
              else
                jq -r '.files // [] | .[] | .filename, (.previous_filename // empty)' compare.json > files
                reason="ficheros del push"
              fi
              ;;
            *)
              reason="evento $EVENT"
              ;;
          esac
          scripts/ci-lanes.sh "${options[@]}" < files | tee -a "$GITHUB_OUTPUT" > lanes
          {
            echo "### Carriles ($reason${labels:+, etiquetas$labels})"
            echo
            sed -E "s/^(windows|macos)=false$/\1: $platform_skip/; s/=true$/: corre/; s/=false$/: omitido, ningun fichero lo afecta/; s/^/- /" lanes
            echo
            echo "Sin lista de ficheros corren todos, salvo Windows y macOS en un push. En un PR, las etiquetas \`ci-windows\`, \`ci-macos\` y \`ci-full\` fuerzan sus carriles en el siguiente push."
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  java:
    name: Cadena Java
    needs: scope
    if: needs.scope.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-runner
        with:
          java: graalvm
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - run: just check-java

  # --------------------------------------------------------------------------
  web:
    name: Cadena TypeScript
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-runner
        with:
          node: true
          apt: repo
          tools: ruff
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      # `check-repo` viaja aqui porque son sellos de milisegundos.
      - run: just check-repo check-ts

  # --------------------------------------------------------------------------
  landing:
    name: Landing
    needs: scope
    if: needs.scope.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-runner
        with:
          node: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - run: just check-landing

  # --------------------------------------------------------------------------
  rust:
    name: Cadena Rust
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tauri-build lee frontendDist dentro de su build.rs, asi que Rust necesita Node.
      - uses: ./.github/actions/setup-runner
        with:
          rust: lint
          node: true
          apt: test
          tools: llvm-cov crap machete diff-cover
          autoscript: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - run: just check-rust

      # `check-rust` corre sin red (ADR-0013): el fetch va aqui, no en el justfile.
      - name: Cobertura del diff contra origin/main
        run: |
          git fetch --depth=1 origin main
          just diff-coverage

  # ==========================================================================
  # CARRIL LENTO
  # ==========================================================================
  native:
    name: Imagen nativa
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/native-tier
        with:
          library: build
          save-cache: ${{ github.ref == 'refs/heads/main' }}

  # ==========================================================================
  # CARRILES DE WINDOWS Y MACOS
  # ==========================================================================
  # Segunda y tercera plataforma (ADR-0035, ADR-0040). En main los corre nightly.yml.
  platforms:
    name: Plataformas
    needs: scope
    if: needs.scope.outputs.windows == 'true' || needs.scope.outputs.macos == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/platforms.yml
    with:
      windows: ${{ needs.scope.outputs.windows == 'true' }}
      macos: ${{ needs.scope.outputs.macos == 'true' }}
      save-cache: ${{ github.ref == 'refs/heads/main' }}

