# La otra mitad del ID-170. Fijar las acciones por SHA sin esto seria
# congelarlas para siempre: lo que se compra al fijarlas no es inmunidad —el
# SHA fijado puede ser malo desde el primer dia— sino que la actualizacion pase
# por una PR que alguien mira, en vez de ocurrir en silencio (ADR-0015).
#
# MENSUAL Y AGRUPADO, y las dos cosas por el mismo motivo: un flujo de PRs que
# nadie mira es peor que no tener ninguna. Semanal y de una en una son cinco
# notificaciones al mes que se cierran sin leer, y a la sexta la revision es
# una firma en blanco.
#
# ESPERA DE SIETE DIAS (`cooldown`): una version recien publicada no se propone
# hasta que lleva una semana fuera, para que un tag comprometido se retire antes.
#
# SOLO `github-actions`. Las dependencias de Rust NO entran aqui a proposito:
# mueven `Cargo.lock`, y con ello hay que regenerar a mano
# `packaging/flatpak/cargo-sources.json` y `sources.lock`. Una PR automatica que
# nace roja en `check-repo` no ayuda a nadie.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      acciones:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - needs-triage
