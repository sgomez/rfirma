# Las comprobaciones del conjunto «peticion»; sus capítulos y su orden los declara `sets.toml`.

[[check]]
id = "a_foreign_scheme_opens_no_channel"
set = "peticion"
citation = "ProtocolInvocationLauncher.java:172-178"
statement = """
Una invocación con un esquema ajeno a afirma:// no abre canal: el original la rechaza con SAF_02
antes de leer nada más de ella.
"""
drive = { mode = "v4", script = "protocol-foreign-scheme" }
assistance = "none"
condition = "no-channel-opens"

