<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap");

:root, [data-theme="light"] {
  --rf-bg:#ffffff; --rf-surface:#fafbfc; --rf-text:#000000; --rf-text-muted:#64748b;
  --rf-primary:#64748b; --rf-on-primary:#ffffff; --rf-primary-hover:#475569;
  --rf-accent:#94a3b8; --rf-border-subtle:#e5e5e5; --rf-border-strong:#64748b;
  --rf-focus-ring:#64748b; --rf-scrim:rgba(0,0,0,.6);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --rf-bg:#18181b; --rf-surface:#15171a; --rf-text:#ffffff; --rf-text-muted:#94a3b8;
    --rf-primary:#94a3b8; --rf-on-primary:#18181b; --rf-primary-hover:#b6c0cd;
    --rf-accent:#64748b; --rf-border-subtle:rgba(229,229,229,.12);
    --rf-border-strong:rgba(229,229,229,.45); --rf-focus-ring:#94a3b8;
  }
}
[data-theme="dark"] {
  --rf-bg:#18181b; --rf-surface:#15171a; --rf-text:#ffffff; --rf-text-muted:#94a3b8;
  --rf-primary:#94a3b8; --rf-on-primary:#18181b; --rf-primary-hover:#b6c0cd;
  --rf-accent:#64748b; --rf-border-subtle:rgba(229,229,229,.12);
  --rf-border-strong:rgba(229,229,229,.45); --rf-focus-ring:#94a3b8;
}
:root {
  --rf-space-xs:8px; --rf-space-sm:16px; --rf-space-md:24px;
  --rf-space-lg:48px; --rf-space-xl:80px; --rf-space-2xl:144px;
  --rf-radius-sm:4px; --rf-radius-md:6px; --rf-radius-lg:8px;
  --rf-radius-xl:16px; --rf-radius-pill:9999px;
  --rf-shadow-card:rgba(0,0,0,0) 0px 0px 0px 0px, rgba(0,0,0,0) 0px 0px 0px 0px, rgba(0,0,0,.1) 0px 0px 1px 0px, rgba(0,0,0,.03) 0px 2px 6px 0px;
  --rf-shadow-elevated:rgba(0,0,0,0) 0px 0px 0px 0px, rgba(0,0,0,0) 0px 0px 0px 0px, rgba(0,0,0,.1) 0px 20px 25px -5px, rgba(0,0,0,.1) 0px 8px 10px -6px;
  --rf-duration-fast:150ms; --rf-duration-base:300ms;
  --rf-easing:cubic-bezier(.4,0,.2,1);
  --rf-font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
a { color:var(--rf-text); } a:hover { color:var(--rf-primary-hover); }
:where([data-theme]) { background:var(--rf-bg); }
.rf-root {
  background:var(--rf-bg); color:var(--rf-text);
  font-family:var(--rf-font-body); height:100%;
  -webkit-font-smoothing:antialiased;
}
.rf-root :focus-visible { outline:2px solid var(--rf-focus-ring); outline-offset:2px; }
.rf-display{font-size:96px;line-height:1;font-weight:700;letter-spacing:-2.4px;margin:0}
.rf-heading{font-size:48px;line-height:1.15;font-weight:700;margin:0}
.rf-title{font-size:20px;line-height:1.3;font-weight:700;margin:0}
.rf-body{font-size:12px;line-height:1;font-weight:400;margin:0}
.rf-prose{font-size:14px;line-height:1.6;font-weight:400;margin:0}
.rf-text-muted{color:var(--rf-text-muted)}
.rf-text-primary{color:var(--rf-primary)}
.rf-stack{display:flex;flex-direction:column}
.rf-row{display:flex;flex-direction:row;align-items:center}
.rf-gap-xs{gap:var(--rf-space-xs)} .rf-gap-sm{gap:var(--rf-space-sm)}
.rf-gap-md{gap:var(--rf-space-md)} .rf-gap-lg{gap:var(--rf-space-lg)}
.rf-section{padding:var(--rf-space-md)}
.rf-divider{border:0;border-top:1px solid var(--rf-border-subtle);margin:0;width:100%}
.rf-surface{background:var(--rf-surface)}
.rf-card{display:flex;flex-direction:column;gap:var(--rf-space-xs);
  padding:var(--rf-space-md);background:var(--rf-surface);
  border:1px solid var(--rf-border-subtle);border-radius:var(--rf-radius-md)}
.rf-card--elevated{box-shadow:var(--rf-shadow-elevated)}
.rf-card--interactive{cursor:pointer;transition:border-color var(--rf-duration-fast) var(--rf-easing)}
.rf-card--interactive:hover{border-color:var(--rf-border-strong)}
.rf-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--rf-space-xs);
  min-height:44px;padding:0 var(--rf-space-sm);border-radius:var(--rf-radius-md);
  font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
  border:1px solid transparent;background:transparent;color:var(--rf-text);
  transition:background-color var(--rf-duration-fast) var(--rf-easing),
             border-color var(--rf-duration-fast) var(--rf-easing),
             color var(--rf-duration-fast) var(--rf-easing)}
.rf-btn--primary{background:var(--rf-primary);color:var(--rf-on-primary)}
.rf-btn--primary:hover{background:var(--rf-primary-hover)}
.rf-btn--secondary{border-color:var(--rf-border-strong);color:var(--rf-text)}
.rf-btn--secondary:hover{border-color:var(--rf-primary-hover);color:var(--rf-primary-hover)}
.rf-btn--ghost{color:var(--rf-text-muted)}
.rf-btn--ghost:hover{color:var(--rf-text)}
.rf-btn[disabled]{opacity:.45;cursor:not-allowed}
.rf-field{display:flex;flex-direction:column;gap:var(--rf-space-xs)}
.rf-label{font-size:12px;line-height:1;font-weight:600;color:var(--rf-text-muted)}
.rf-input{min-height:44px;padding:0 var(--rf-space-sm);font-family:inherit;font-size:14px;
  color:var(--rf-text);background:var(--rf-bg);
  border:1px solid var(--rf-border-strong);border-radius:var(--rf-radius-md)}
.rf-hint{font-size:12px;line-height:1.4;color:var(--rf-text-muted)}
.rf-field--error .rf-input{border-width:2px}
.rf-field--error .rf-hint{font-weight:700;color:var(--rf-text)}
.rf-badge{display:inline-flex;align-items:center;padding:4px var(--rf-space-xs);
  border-radius:var(--rf-radius-pill);border:1px solid var(--rf-border-subtle);
  font-size:12px;line-height:1;font-weight:600;color:var(--rf-text-muted)}
.rf-badge--primary{background:var(--rf-primary);color:var(--rf-on-primary);border-color:transparent}
.rf-scrim{position:absolute;inset:0;background:var(--rf-scrim);
  display:flex;align-items:center;justify-content:center}
.rf-dialog{display:flex;flex-direction:column;gap:var(--rf-space-md);
  padding:var(--rf-space-md);background:var(--rf-bg);
  border:1px solid var(--rf-border-subtle);border-radius:var(--rf-radius-xl);
  box-shadow:var(--rf-shadow-elevated);width:420px}
</style>
</helmet>
<div class="rf-root" data-theme="{{tema}}" style="width:1180px;height:700px;display:flex;flex-direction:column;position:relative;overflow:hidden">


<header class="rf-row" style="height:56px;flex:none;padding:0 var(--rf-space-sm) 0 var(--rf-space-md);
  gap:var(--rf-space-sm);border-bottom:1px solid var(--rf-border-subtle);
  background:var(--rf-surface);position:relative;z-index:5">
  <span class="rf-title" style="font-size:15px;letter-spacing:.4px">rFirma</span>
  <div style="flex:1"></div>
  
  <span style="width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;
    border-radius:var(--rf-radius-md);
    background:var(--rf-primary);color:var(--rf-on-primary)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span>
  <div style="position:absolute;top:52px;right:var(--rf-space-sm);min-width:230px;
    padding:6px;background:var(--rf-bg);border:1px solid var(--rf-border-subtle);
    border-radius:var(--rf-radius-md);box-shadow:var(--rf-shadow-elevated);
    display:flex;flex-direction:column;gap:2px" role="menu">
    <sc-for list="{{ entradas }}" as="entrada" hint-placeholder-count="4">
      <sc-if value="{{entrada.hayDivisor}}" hint-placeholder-val="{{false}}">
        <hr class="rf-divider" style="margin:4px 0">
      </sc-if>
      <span class="rf-prose rf-row rf-gap-xs" role="menuitem"
        style="padding:9px 10px;border-radius:var(--rf-radius-sm);{{entrada.estiloFoco}}">
        <span style="flex:1;min-width:0">{{entrada.texto}}</span>
        <span style="width:14px;height:14px;flex:none;display:flex;align-items:center;justify-content:center">
          <sc-if value="{{entrada.esEnlace}}" hint-placeholder-val="{{false}}">
            <span style="display:flex;color:var(--rf-text-muted)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg></span>
          </sc-if>
          <sc-if value="{{entrada.hayAviso}}" hint-placeholder-val="{{false}}">
            <span style="display:flex;color:var(--rf-text)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17v.5"/></svg></span>
          </sc-if>
        </span>
      </span>
    </sc-for>
  </div>
</header>
<div class="rf-row" style="flex:1;min-height:0;align-items:stretch">
  
<aside class="rf-stack rf-gap-sm" style="width:300px;flex:none;padding:var(--rf-space-sm);overflow:auto;
  border-right:1px solid var(--rf-border-subtle);background:var(--rf-surface)">
  
<div class="rf-stack rf-gap-xs" style="align-items:center;justify-content:center;
  padding:var(--rf-space-sm);gap:var(--rf-space-xs);
  border:1px dashed var(--rf-border-strong);
  border-radius:var(--rf-radius-md);cursor:pointer;
  ">
  <span style="color:var(--rf-text-muted);display:flex"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M8 8l4-4 4 4"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></span>
  <p class="rf-prose" style="text-align:center">Arrastra un PDF o pulsa para abrirlo</p>
  
</div>
  <p class="rf-label" style="letter-spacing:.6px;text-transform:uppercase">Recientes</p>
  <p class="rf-prose rf-text-muted">Aquí aparecerán los documentos que vayas firmando.</p>
</aside>
  <div class="rf-stack rf-gap-md" style="flex:1;align-items:center;justify-content:center">
    
<div class="rf-stack rf-gap-xs" style="align-items:center;justify-content:center;
  padding:var(--rf-space-lg);gap:var(--rf-space-sm);
  border:2px dashed var(--rf-border-strong);
  border-radius:var(--rf-radius-xl);cursor:pointer;
  width:520px;height:300px">
  <span style="color:var(--rf-text-muted);display:flex"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M8 8l4-4 4 4"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></span>
  <p class="rf-title" style="text-align:center">Arrastra un PDF o pulsa para abrirlo</p>
  <p class="rf-prose rf-text-muted">Se abrirá el explorador de archivos</p>
</div>
    <p class="rf-prose rf-text-muted">Solo PDF. El documento no sale de tu ordenador en ningún momento.</p>
  </div>
</div>
</div>
</x-dc>
<script data-dc-script data-props='{"tema":{"editor":"enum","options":["light","dark"],"default":"light","section":"Tema"},"aviso":{"editor":"enum","options":["todo en orden","hay algo que revisar"],"default":"hay algo que revisar","section":"Aviso en el menú"},"foco":{"editor":"enum","options":["sin foco","teclado · primera entrada","teclado · la salida al navegador"],"default":"teclado · la salida al navegador","section":"Foco por teclado"},"$preview":{"width":1180,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    // EL MENU DE LA CABECERA (#656, dibujado en el #659). Cuatro entradas en
    // dos grupos separados por un divisor: arriba lo que habla de ESTA
    // INSTALACION, abajo el grupo canonico de la HIG (Preferences · Help ·
    // About) en su orden.
    // «Estado de rFirma» y no «Estado»: en esta misma franja vive la insignia
    // del documento.
    // Los dos iconos no salen de ninguna biblioteca: son <svg> en linea, como
    // las tres rayas del boton, y caen en la MISMA COLUMNA de 14 px, que se
    // reserva siempre para que la entrada no cambie de alto ni de ancho.
    // El triangulo es LA MISMA SILUETA que marca «Atención» en el panel de
    // estado: dos dibujos distintos para lo mismo serian dos vocabularios.
    const tema = this.props.tema || "light";
    const hayAviso = (this.props.aviso || "hay algo que revisar") === "hay algo que revisar";
    const foco = this.props.foco || "teclado · la salida al navegador";

    const textos = [
      { texto: "Estado de rFirma", hayAviso: hayAviso },
      { texto: "Preferencias…", hayDivisor: true },
      { texto: "Comentarios y ayuda", esEnlace: true },
      { texto: "Acerca de rFirma" }
    ];

    let enfocada = -1;
    if (foco === "teclado · primera entrada") enfocada = 0;
    if (foco === "teclado · la salida al navegador") enfocada = 2;

    return {
      tema: tema,
      entradas: textos.map((e, i) => ({
        texto: e.texto,
        esEnlace: e.esEnlace === true,
        hayAviso: e.hayAviso === true,
        hayDivisor: e.hayDivisor === true,
        estiloFoco: i === enfocada
          ? "background:var(--rf-surface);outline:2px solid var(--rf-focus-ring);outline-offset:2px"
          : ""
      }))
    };
  }
}
</script>
</body>
</html>
