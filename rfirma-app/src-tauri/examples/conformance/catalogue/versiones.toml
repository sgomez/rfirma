# Entradas del catálogo de la suite de conformidad para el conjunto «versiones».
# Repartido por `catalogue.rs`; la forma de cada entrada la vigila la guarda
# `conformance_catalogue_is_sound.rs`.

[[check]]
id = "operation_supported_protocol_version"
suite = "versiones"
chapter = "14"
citation = "ProtocolVersion.java:60-62; ProtocolInvocationLauncher.java:62, 907-915"
statement = """
Las operaciones aceptan versiones de protocolo menores o iguales a 4
(MAX_PROTOCOL_VERSION_SUPPORTED).
"""
drive = { mode = "v4", script = "protocol-v4" }

[check.expect.autofirma]
verdict = "conforme"

[check.expect.rfirma]
verdict = "conforme"

[[check]]
id = "operation_unsupported_protocol_version_rejected"
suite = "versiones"
chapter = "14"
citation = "ProtocolVersion.java:60-62; ProtocolInvocationLauncherSign.java:133-140"
statement = """
Una versión de protocolo solicitada superior a 4 (p. ej. ver=5) es rechazada con el código SAF_21.
"""
drive = { mode = "v4", script = "protocol-v4" }

[check.expect.autofirma]
verdict = "conforme"

[check.expect.rfirma]
verdict = "conforme"

[[check]]
id = "operation_minimum_client_version_satisfied"
suite = "versiones"
chapter = "14"
citation = "Version.java:120-169; ProtocolInvocationLauncherSign.java:143-150"
statement = """
Si mcv solicita una versión igual o inferior a la versión del aplicativo (p. ej. mcv=1.0.0), la
operación continúa sin error de versión.
"""
drive = { mode = "v4", script = "protocol-v4" }

[check.expect.autofirma]
verdict = "conforme"

[check.expect.rfirma]
verdict = "conforme"

[[check]]
id = "operation_minimum_client_version_unsatisfied_rejected"
suite = "versiones"
chapter = "14"
citation = "Version.java:120-169; ProtocolInvocationLauncherSign.java:143-150; ProtocolInvocationLauncherErrorManager.java:72"
statement = """
Si mcv solicita una versión superior a la de la aplicación (p. ej. mcv=99.0.0), la operación es
