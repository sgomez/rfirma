name: Instala just
description: Descarga el binario oficial de just en la versión y el sha256 que fija versions.env.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/load-versions

    - if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        archivo="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        directorio="$(mktemp -d)"
        curl -fsSL -o "$directorio/$archivo" \
          "https://github.com/casey/just/releases/download/${JUST_VERSION}/${archivo}"
        echo "${JUST_SHA256_LINUX}  $directorio/$archivo" | sha256sum -c -
        tar -xzf "$directorio/$archivo" -C "$directorio" just
        sudo install -m 755 "$directorio/just" /usr/local/bin/just
        rm -rf "$directorio"
        just --version

    - if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        archivo="just-${JUST_VERSION}-x86_64-pc-windows-msvc.zip"
        directorio="$RUNNER_TEMP/just"
        mkdir -p "$directorio"
        curl -fsSL -o "$directorio/$archivo" \
          "https://github.com/casey/just/releases/download/${JUST_VERSION}/${archivo}"
        echo "${JUST_SHA256_WINDOWS}  $directorio/$archivo" | sha256sum -c -
        unzip -o -q "$directorio/$archivo" just.exe -d "$directorio"
        cygpath -w "$directorio" >> "$GITHUB_PATH"
        "$directorio/just.exe" --version
