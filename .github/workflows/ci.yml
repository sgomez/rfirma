# Puerta automatica del repositorio.
#
# Decidida en https://github.com/sgomez/rfirma/issues/11 y ampliada a las tres
# cadenas en https://github.com/sgomez/rfirma/issues/47, siguiendo el ADR-0014.
#
# QUE COMPRUEBA HOY: `just check` entero, pero REPARTIDO EN UN JOB POR CADENA
# —el puente Java compila con -Xlint:all y pasa sus pruebas, Biome y tsc pasan
# sobre TypeScript, clippy y la puerta CRAP sobre Rust. Sigue SIN comprobar que
# una firma valga: eso es grada C y vive en el carril lento. Lee la seccion de
# CI de docs/agents/code-host.md antes de fiarte de un check en verde.
#
# TRES JOBS Y NO UNO, POR TIEMPO DE PARED. Las tres cadenas no se necesitan
# entre si, asi que encadenarlas era pagar la suma cuando se puede pagar la mas
# lenta. Y cada job instala solo lo suyo: el de Java no necesita las librerias
# del WebView ni cargo-crap, el de TypeScript no necesita ni GraalVM ni Rust.
# Solo el de Rust paga los 34 s de apt y los ~40 s de restaurar la cache de
# cargo.
#
# DOS CARRILES, POR VELOCIDAD. Esto es antes que nada el bucle de
# realimentacion de un agente, asi que lo que corre siempre tiene que ser
# rapido:
#
#   cadena Java / TypeScript / Rust   en cada PR y en cada push a main
#   native                            solo en etiquetas, a mano, con la
#                                     etiqueta 'native', y una vez por semana
#
# El puente Java apenas se va a tocar una vez escrito, asi que reconstruir la
# imagen nativa en cada PR seria pagar cuatro veces el carril rapido para no
# enterarse de nada nuevo. Quien si la toque, que ponga la etiqueta 'native'
# en su PR.
name: CI

on:
  pull_request:
    # 'labeled' incluido a proposito: sin el, poner la etiqueta 'native' no
    # dispararia nada y habria que empujar otra vez para que se enterase.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    # Las caches de GitHub caducan a los 7 dias sin usarse, y llenar la de
    # ~/.m2 cuesta compilar AutoFirma entera. Esto la mantiene caliente, es la
    # red de seguridad del carril lento, y ademas hace de vigilante del kit
    # FNMT (job 'fnmt-kit-expiry-warning').
    - cron: '17 4 * * 1'

permissions:
  contents: read

# En un repositorio movido por agentes lo normal es empujar tres veces seguidas
# a la misma rama. Sin esto, las dos primeras ejecuciones siguen ocupando
# runners para producir un veredicto que ya no le importa a nadie. Solo en PR:
# en main cada commit merece su propia ejecucion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # GraalVM CE 25, fijado por el issue #6: la linea 21 aborta dentro del
  # JNI_OnLoad de libawt.so con cualquier firma visible. El pom sigue
  # compilando a release 21.
  GRAALVM_VERSION: '25'
  # Version FIJADA de cargo-crap (ADR-0014): un solo mantenedor y cuatro meses
  # de vida, asi que una publicacion suya no puede poner en rojo un PR que no
  # la ha tocado. Tiene que coincidir con `crap_version` del justfile.
  CRAP_VERSION: '0.4.3'
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # CARRIL RAPIDO
  # ==========================================================================
  # Cada job instala SOLO lo de su cadena. Los tres arrancan a la vez, asi que
  # la espera es la del mas lento (Rust) y no la suma.

  # --------------------------------------------------------------------------
  java:
    name: Cadena Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: GraalVM CE ${{ env.GRAALVM_VERSION }}
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: ${{ env.GRAALVM_VERSION }}
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Las dependencias de AutoFirma no estan en Maven Central: bootstrap.sh
      # clona el repositorio oficial en la etiqueta v1.9.1 y las compila. Esa
      # etiqueta es inmutable, asi que la cache se llena una vez y acierta
      # siempre despues; solo se invalida si cambia la version que pide
      # bootstrap.sh o las dependencias del pom.
      #
      # Descartado publicarlas en un registro propio: seria redistribuir
      # binarios GPL de terceros, con las obligaciones de licencia que eso
      # arrastra.
      - name: Cache de ~/.m2
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('bootstrap.sh', 'rfirma-native-bridge/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-

      - name: just
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends just

      # Una sola JVM: `mvn -B verify` compila con -Xlint:all, prueba y
      # empaqueta. Ver `check-java` en el justfile.
      - run: just check-java

  # --------------------------------------------------------------------------
  web:
    name: Cadena TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # package_json_file: la raiz no tiene package.json (ID-01), asi que sin
      # esto la accion falla con "No pnpm version is specified".
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: rfirma-app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: rfirma-app/pnpm-lock.yaml

      # gettext trae msgfmt y msgcmp, que son `check-po` (ID-128).
      - name: just y gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends just gettext

      # `check-repo` viaja aqui —y no en un cuarto job— porque son dos sellos
      # de milisegundos y montar un runner para ellos costaria cien veces mas
      # que ejecutarlos.
      - run: just check-repo check-ts

  # --------------------------------------------------------------------------
  rust:
    name: Cadena Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Rust necesita la cadena de Node aunque no ejecute una sola prueba de
      # TypeScript: tauri-build lee frontendDist (../dist) dentro de su propio
      # build.rs, asi que sin `vite build` clippy no llega a mirar ni una linea.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: rfirma-app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: rfirma-app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # Fijada por SHA (ID-170), asi que la accion ya no puede leer el canal
          # de la etiqueta con la que se invoca: hay que nombrarlo aqui.
          toolchain: stable
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rfirma-app/src-tauri

      # Tauri v2 en Linux compila contra WebKitGTK 4.1. Sin estos paquetes el
      # carril entero se cae en el build.rs de javascriptcore-rs-sys con un
      # "pkg-config exited with status code 1" que no dice de que va.
      #
      # softhsm2 y opensc son la GRADA B del ADR-0014: son segundos de apt y a
      # cambio las pruebas del modulo PKCS#11 corren en cada PR, contra un token
      # de verdad, en vez de quedarse ignoradas. `just check-rust` provisiona el
      # token solo (receta `token`), asi que aqui basta con instalarlos.
      #
      # libnss3-tools es la otra mitad de esa grada desde el #99: trae certutil y
      # pk12util, con los que cada prueba del almacen NSS se monta su propio
      # perfil desechable en un directorio temporal. El libsoftokn3.so que lo
      # abre viene con libnss3, que ya esta en el runner.
      - name: Dependencias de sistema de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            just \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            build-essential \
            file \
            gettext \
            softhsm2 \
            opensc \
            libnss3-tools

      # Binarios preconstruidos: compilarlos desde fuente serian minutos en
      # cada ejecucion. La version de cargo-crap va fijada; la de llvm-cov no
      # hace falta porque no es una puerta, solo produce el lcov.
      - uses: cargo-bins/cargo-binstall@75b4bfae1b2c753a6806bbce6e6cb89b602de33c # v1.22.0
      - name: Herramienta de cobertura y de CRAP
        run: |
          cargo binstall --no-confirm cargo-llvm-cov
          cargo binstall --no-confirm "cargo-crap@${CRAP_VERSION}"

      # Sin RFIRMA_SKIP_NATIVE: `check-rust` ya no encadena `check-native`, asi
      # que no hay nada que saltarse. Y sin `cargo build --release`, que es un
      # arbol de dependencias entero que aqui no ejecuta nadie — lo compila el
      # carril lento, junto al empaquetado que lo usa.
      - run: just check-rust

  # ==========================================================================
  # CARRIL LENTO
  # ==========================================================================
  native:
    name: Imagen nativa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # El carril lento no corre por omision. Medido en este mismo
      # repositorio: native-image son 1 m 22 s y el job entero 3 m 14 s,
      # frente a los segundos del carril rapido. Cabe de sobra en un runner
      # estandar --la duda que dejo abierta el issue #11 queda resuelta--,
      # pero eso no es razon para pagarlo en cada PR.
      - name: Decide si hace falta
        id: scope
        run: |
          case "${{ github.event_name }}" in
            push|workflow_dispatch|schedule)
              echo "build=true" >> "$GITHUB_OUTPUT" ;;
            pull_request)
              if ${{ contains(github.event.pull_request.labels.*.name, 'native') }}; then
                echo "build=true" >> "$GITHUB_OUTPUT"
              else
                echo "build=false" >> "$GITHUB_OUTPUT"
                echo "Carril lento omitido. Pon la etiqueta \`native\` en el PR si tocas el puente." \
                  >> "$GITHUB_STEP_SUMMARY"
              fi ;;
          esac

      - name: GraalVM CE ${{ env.GRAALVM_VERSION }}
        if: steps.scope.outputs.build == 'true'
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: ${{ env.GRAALVM_VERSION }}
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache de ~/.m2
        if: steps.scope.outputs.build == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('bootstrap.sh', 'rfirma-native-bridge/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.scope.outputs.build == 'true'
        with:
          package_json_file: rfirma-app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.scope.outputs.build == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: rfirma-app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: steps.scope.outputs.build == 'true'
        with:
          # Ver el comentario del mismo paso en el carril rapido.
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.scope.outputs.build == 'true'
        with:
          workspaces: rfirma-app/src-tauri

      - name: Dependencias de sistema
        if: steps.scope.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            just \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            build-essential \
            file \
            gettext \
            poppler-utils \
            softhsm2 \
            opensc \
            libnss3-tools

      - uses: cargo-bins/cargo-binstall@75b4bfae1b2c753a6806bbce6e6cb89b602de33c # v1.22.0
        if: steps.scope.outputs.build == 'true'
      - name: Herramienta de cobertura y de CRAP
        if: steps.scope.outputs.build == 'true'
        run: |
          cargo binstall --no-confirm cargo-llvm-cov
          cargo binstall --no-confirm "cargo-crap@${CRAP_VERSION}"

      - name: Construye la libreria nativa
        if: steps.scope.outputs.build == 'true'
        run: |
          export GRAALVM_HOME="$JAVA_HOME"
          just native

      # Aqui SI existe librfirma_crypto.so, asi que las pruebas de grada C
      # —marcadas #[ignore]— se ejecutan de verdad. El carril rapido solo las
      # compila (TD-02).
      - name: Pruebas de grada C
        if: steps.scope.outputs.build == 'true'
        run: just test-native

      # EL PDF DE LA PUERTA MANUAL (TD-04). `pdfsig` es la puerta automatica,
      # pero el criterio de terminado del hito promete que un VALIDADOR OFICIAL
      # acepta la firma, y VALIDe es red, web y sin API estable: esa puerta la
      # cierra una persona, una vez por etiqueta v*. Este paso es lo unico que
      # le hace falta para poder cerrarla — el PDF del caso maximo (recuadro
      # con texto Y rubrica), sin reproducir GraalVM, SoftHSM y poppler en su
      # equipo. Se sube SIEMPRE que las pruebas hayan corrido, tambien si algo
      # posterior falla: un PDF que no valida es justo el que hay que mirar.
      - name: PDF para el validador oficial
        if: steps.scope.outputs.build == 'true' && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdf-puerta-manual
          path: rfirma-app/src-tauri/target/tmp/manual-gate.pdf
          # `warn` y no `error`: este paso corre tambien cuando las pruebas han
          # fallado antes de llegar a la de la puerta manual, y ahi el PDF no
          # existe. Un segundo rojo — «artefacto no encontrado» — solo taparia
          # el rojo de verdad.
          if-no-files-found: warn

      # La misma medicion CRAP que el carril rapido pero SIN --allow sobre el
      # modulo FFI: con la cobertura de la grada C incluida, ese modulo ya
      # puede dar la cara (ADR-0014).
      - name: CRAP sin exclusiones
        if: steps.scope.outputs.build == 'true'
        run: just crap-full

      # EL BINARIO DE RELEASE VIVE AQUI, y no en el carril rapido. Es un arbol
      # de dependencias entero aparte del de depuracion y del instrumentado, y
      # alli no lo ejecutaba nadie: lo que se empaqueta es el flatpak, que es
      # cosa de este carril. --features custom-protocol no es opcional; el
      # justfile explica por que.
      #
      # Lo unico que esto comprueba y el carril rapido no es que el perfil de
      # release enlace: `clippy --all-targets --all-features` ya compila el
      # mismo codigo, custom-protocol incluido.
      - name: Compila el binario de release
        if: steps.scope.outputs.build == 'true'
        run: just build-rust

  # ==========================================================================
  # VIGILANTE DEL KIT FNMT
  # ==========================================================================
  #
  # La otra mitad de la bomba de relojeria del ADR-0014. La mitad dura vive en
  # rfirma-app/src-tauri/tests/fnmt_kit.rs y falla el dia que el certificado
  # caduque; este avisa 90 dias antes abriendo una issue.
  #
  # Y VIVE AQUI, NO EN EL CARRIL RAPIDO, A PROPOSITO: avisar alli rompería
  # todos los PRs a la vez, un dia cualquiera de 2028, con merge automatico
  # puesto. El cron es el unico sitio donde avisar no bloquea a nadie.
  fnmt-kit-expiry-warning:
    name: Caducidad del kit FNMT
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      # notAfter de testdata/fnmt/active-rsa.p12. Tiene que coincidir con
      # ACTIVE_EXPIRY_ISO de tests/fnmt_kit.rs y con testdata/fnmt/README.md.
      EXPIRY_DATE: '2028-10-30'
      STCERES: 'https://www.sede.fnmt.gob.es/documents/10445900/10649507/Certificados_pruebas_todas_CAs.rar'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Avisa si quedan menos de 90 dias
        run: |
          set -euo pipefail
          days_left=$(( ( $(date -u -d "$EXPIRY_DATE" +%s) - $(date -u +%s) ) / 86400 ))
          echo "Quedan $days_left dias para el $EXPIRY_DATE." >> "$GITHUB_STEP_SUMMARY"
          if [ "$days_left" -gt 90 ]; then
            exit 0
          fi

          title="El kit FNMT de testdata/fnmt/ caduca el $EXPIRY_DATE"
          # Una sola issue viva: sin esto el cron abriria una cada lunes
          # durante trece semanas.
          open_count=$(gh issue list --state open --search "$title in:title" \
            --json number --jq 'length')
          if [ "$open_count" != "0" ]; then
            echo "Ya hay una issue abierta; no se abre otra." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # El cuerpo va a un fichero, no a un $(cat <<...) en linea: dentro de
          # un bloque YAML el heredoc conservaria la sangria de cada linea y el
          # markdown llegaria a la issue como un bloque de codigo.
          body=$(mktemp)
          {
            printf '`testdata/fnmt/active-rsa.p12` caduca el **%s**: quedan **%s dias**.\n\n' \
              "$EXPIRY_DATE" "$days_left"
            printf 'Es el certificado del camino feliz, el que esta en el token SoftHSM `rfirma-test`.\n'
            printf 'Cuando caduque, `rfirma-app/src-tauri/tests/fnmt_kit.rs` empezara a fallar en el\n'
            printf 'carril rapido y bloqueara todas las entregas.\n\n'
            printf '## Que hay que hacer\n\n'
            printf '1. Descargar el kit nuevo de <%s>.\n' "$STCERES"
            printf '2. Sustituir los tres `.p12` de `testdata/fnmt/`.\n'
            printf '3. Actualizar las huellas SHA-256 y las fechas en `testdata/fnmt/README.md` y en\n'
            printf '   `rfirma-app/src-tauri/tests/fnmt_kit.rs` (`FINGERPRINTS`, `ACTIVE_EXPIRY_EPOCH`,\n'
            printf '   `ACTIVE_EXPIRY_ISO`), y la `EXPIRY_DATE` de este workflow.\n'
            printf '4. Reimportar el certificado activo en SoftHSM segun\n'
            printf '   `docs/research/token-pkcs11-pruebas.md`.\n\n'
            printf 'Abierta automaticamente por el cron semanal de `.github/workflows/ci.yml`\n'
            printf '(ADR-0014, TD-07).\n'
          } > "$body"

          gh issue create --title "$title" --label needs-triage --body-file "$body"
