[[check]]
id = "service_channel_version_range"
set = "canal.servicio"
citation = "ServiceInvocationManager.java:42-45, 212-220; ProtocolInvocationLauncher.java:281-288"
statement = """
El canal socket HTTP (afirma://service) sólo admite las versiones 1, 2 y 3; la versión 4 se rechaza
con SAF_21.
"""
unmeasurable = "SAF_21 se muestra en un diálogo y no se abre canal: no hay cable por el que llegue, y la sede sólo ve que el cliente publicado agota sus reintentos."

[[check]]
id = "a_ver_inside_an_order_leaves_the_negotiated_version_alone"
set = "canal.servicio"
citation = "CommandProcessorThread.java:327-361; ProtocolInvocationLauncher.java:300, 650"
statement = """
La versión negociada al abrir el canal rige toda la sesión: un ver dentro de la operación que llega
por cmd= no la cambia, y ver=5 no se rechaza con SAF_21.
"""
drive = { mode = "service", script = "protocol-service" }
assistance = "none"
condition = "an-inner-ver-is-ignored"

[[check]]
id = "the_service_channel_closes_after_ninety_seconds_of_inactivity"
set = "canal.servicio"
citation = "ServiceInvocationManager.java:127-134; CommandProcessorThread.java:452-460"
statement = """
El canal se cierra tras 90 segundos sin órdenes, y una orden inválida no reinicia la cuenta.
"""
unmeasurable = "El temporizador de inactividad vive dentro del cliente: la suite no instrumenta su máquina virtual ni lee su estado, y el cierre no deja en el cable nada que lo distinga de un cliente caído."

[[check]]
id = "concurrent_service_orders_do_not_share_their_state"
set = "canal.servicio"
citation = "ServiceInvocationManager.java:136-143; CommandProcessorThread.java:67-69"
statement = """
Dos conversaciones simultáneas con el canal no se mezclan los fragmentos ni las partes del resultado
(BUG-09).
"""
unmeasurable = "La concurrencia entre sesiones depende del estado interno del cliente y de un entrelazado no determinista: la suite no la puede provocar ni leer desde el cable sin instrumentar la máquina virtual."

[[check]]
id = "a_saf_code_reaches_the_published_client_intact_over_the_service_channel"
set = "canal.servicio"
citation = "CommandProcessorThread.java:333-348, 493-512; autoscript.js:3355-3385"
statement = """
Por el socket local el mismo rechazo viaja en Base64 dentro de una respuesta HTTP 200, y el cliente
publicado lo recibe descodificado con el prefijo SAF_nn intacto.
"""
drive = { mode = "service", script = "signwithanunknownformat" }
assistance = "none"
saf = "SAF_06"

[[check]]
id = "an_exhausted_memory_answers_memory_error_over_the_service_channel"
set = "canal.servicio"
citation = "CommandProcessorThread.java:142-145, 481-487; autoscript.js:2312, 3131"
statement = """
Una falta de memoria en el socket local responde el literal no numerado MEMORY_ERROR, que el cliente
publicado entrega como es.gob.afirma.core.OutOfMemoryError.
"""
unmeasurable = "Provocarla exige agotar el montón del cliente con un documento mayor que él, y la suite no fija ni conoce ese montón: el mismo documento revienta a un cliente y pasa por otro."

[[check]]
id = "a_save_over_the_service_channel_answers_save_ok_and_not_a_signature"
set = "canal.servicio"
citation = "CommandProcessorThread.java:290-305; autoscript.js:3423-3428"
statement = """
Por el socket local, un guardado con éxito responde SAVE_OK, que el cliente publicado reconoce como
confirmación y no confunde con una firma. La misma confirmación por WebSocket la mide el conjunto
de operaciones.
"""
drive = { mode = "service", script = "save" }
assistance = "person"
saf = "SAVE_OK"
question = "¿se pidió elegir dónde guardar el fichero? [s/n]"
person = { yes = "se pidió dónde guardar el fichero", no = "no se pidió dónde guardar el fichero", yes_means = "conforme" }
warning = "Va a aparecer la ventana nativa para elegir dónde guardar el fichero."
