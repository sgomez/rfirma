# Firma lo que construyo `build.yml`, sin secretos, y deja la Release en borrador (ADR-0015).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      expected-version: ${{ github.ref_name }}

  release:
    name: Firma y deja la Release en borrador
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      IS_PRERELEASE: ${{ needs.build.outputs.native-packages == 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Las etiquetas: la firma de actualizacion se comprueba contra la ultima estable (ADR-0015).
          fetch-depth: 0

      - name: Paquetes de la construccion
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.packages-artifact }}
          path: paquetes

      - name: PDF de la puerta manual
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pdf-puerta-manual
          path: puerta-manual

      - name: rpmsign, gnupg y minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm gnupg minisign

      - name: Subclave de firma
        id: gpg
        uses: ./.github/actions/import-signing-key
        with:
          private-key: ${{ secrets.GPG_SIGNING_SUBKEY }}
          passphrase: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
          expected-fingerprint: ${{ vars.GPG_FINGERPRINT }}

      # `SECURITY.md` y la portada publican la huella a mano y nada mas la compara con la real.
      - name: La huella publicada es la que firma
        env:
          FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          set -euo pipefail
          for fichero in SECURITY.md packaging/repo/site/src/components/Transparency.astro; do
            # Agrupada de cuatro en cuatro, con espacios en Markdown y `&nbsp;` en HTML.
            if ! sed 's/&nbsp;/ /g; s/[[:space:]]//g' "$fichero" \
                 | grep -qiF "$FINGERPRINT"; then
              echo "::error file=$fichero::$fichero no publica la huella de la clave que firma ($FINGERPRINT)" >&2
              echo "Si has rotado la clave, actualiza ahi la huella nueva." >&2
              exit 1
            fi
            echo "OK  $fichero publica la huella de la clave que firma"
          done

      # El orden firmar el `.rpm`, resumir, atestar y adjuntar es obligatorio: firmar un `.rpm` lo modifica (ADR-0015).
      - name: Firma cada .rpm
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t rpms < <(scripts/packages-manifest.sh files paquetes rpm | sed 's|^|paquetes/|')
          if [ ${#rpms[@]} -eq 0 ]; then
            echo "sin .rpm que firmar"
            exit 0
          fi
          # `rpmsign` no sabe de `--passphrase`: se redefine el mandato con `--pinentry-mode loopback`.
          cat > "$HOME/.rpmmacros" <<EOF
          %_signature gpg
          %_gpg_name ${{ steps.gpg.outputs.key-id }}
          %__gpg_sign_cmd %{__gpg} gpg --batch --no-verbose --no-armor \\
              --pinentry-mode loopback --passphrase-file ${{ steps.gpg.outputs.passphrase-file }} \\
              -u "%{_gpg_name}" -sbo %{__signature_filename} %{__plaintext_filename}
          EOF
          rpmsign --addsign "${rpms[@]}"
          # `rpm --checksig` usa su propio anillo, no el de gpg.
          rpm --import "${{ steps.gpg.outputs.public-key }}"
          for paquete in "${rpms[@]}"; do
            rpm --checksig "$paquete"
          done

      - name: Digests, contra los de la construccion
        env:
          DIGESTS_DE_LA_CONSTRUCCION: ${{ needs.build.outputs.digests }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DIGESTS_DE_LA_CONSTRUCCION" > "${{ runner.temp }}/SHA256SUMS.construccion"
          packaging/verify-packages.sh paquetes --against "${{ runner.temp }}/SHA256SUMS.construccion"

      # Despues de comparar con la construccion y antes del `SHA256SUMS`, que cubre el `.sig` (ADR-0015).
      - name: Firma de actualizacion de cada -setup.exe
        if: ${{ env.IS_PRERELEASE != 'true' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: packaging/windows/sign-updater.sh paquetes

      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd paquetes
          rm -f SHA256SUMS SHA256SUMS.asc
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Firma el SHA256SUMS
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "${{ steps.gpg.outputs.passphrase-file }}" \
            --local-user "${{ steps.gpg.outputs.key-id }}" \
            --armor --detach-sign --output paquetes/SHA256SUMS.asc paquetes/SHA256SUMS
          gpg --verify paquetes/SHA256SUMS.asc paquetes/SHA256SUMS

      - name: Paquetes a atestar
        id: subjects
        run: |
          set -euo pipefail
          {
            echo 'paths<<FIN'
            scripts/packages-manifest.sh files paquetes | sed 's|^|paquetes/|'
            echo FIN
          } >> "$GITHUB_OUTPUT"

      - name: Atestacion de procedencia
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}

      - name: Notas del borrador
        run: scripts/packages-manifest.sh notes paquetes > "${{ runner.temp }}/notas.md"

      # `--draft` siempre, sin condicion: publicar es un gesto humano (ADR-0015).
      - name: Release en borrador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            prerelease=(--prerelease)
          fi
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "rFirma ${VERSION}" \
            --notes-file "${{ runner.temp }}/notas.md" \
            --generate-notes \
            "${prerelease[@]}" \
            paquetes/* \
            puerta-manual/manual-gate.pdf
          {
            echo "### Borrador listo"
            echo "Falta el gesto humano: revisar el PDF de la puerta manual y publicar."
            echo
            gh release view "${{ github.ref_name }}" --json url --jq .url
          } >> "$GITHUB_STEP_SUMMARY"
