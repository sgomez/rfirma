packages:
  - rfirma-app
  - rfirma-conformance/console
  - packaging/repo/site

catalog:
  '@biomejs/biome': 2.6.3
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.8
  '@types/node': 26.6.5
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.2
  '@vitest/coverage-v8': 5.0.5
  jsdom: 30.1.3
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 7.0.2
  vite: 8.3.5
  vitest: 5.0.5

allowBuilds:
  '@swc/core': false
  esbuild: true
  # Su postinstall reescribiría desde un worktree los hooks que comparte el checkout principal.
  lefthook: false
  sharp: true

# i18next-cli va fijada exacta: la sube una persona, no el reloj de la cadena de suministro.
minimumReleaseAgeExclude:
  - i18next-cli@1.72.4

overrides:
  source-map-js: '>=1.2.2'
  postcss-selector-parser: '>=7.1.6'
