# Las comprobaciones del conjunto «canal.websocket»; sus capítulos y su orden los declara `sets.toml`.

[[check]]
id = "v4_ports_negotiation"
set = "canal.websocket"
citation = "ProtocolInvocationLauncher.java:233-236, 976-990; AfirmaWebSocketServerManager.java:64-90"
bug = "BUG-33"
statement = """
El canal v4 enlaza el primer puerto libre de la lista de candidatos (ports=p1,p2,p3): con el
primero ocupado, liga el siguiente.
"""
drive = { mode = "v4", script = "protocol-v4" }
assistance = "none"
harness = "occupied_service_ports"
ports = [54321]
condition = "the-first-free-candidate-bound"

[[check]]
id = "v4_echo_greeting"
set = "canal.websocket"
citation = "AfirmaWebSocketServerV4.java:81-83"
statement = """
La petición de eco echo=-idsession=<idSession>@EOF recibe la respuesta de texto OK.
"""
drive = { mode = "v4", script = "protocol-v4" }
assistance = "none"
greeting = true
condition = "the-echo-with-its-session-answers-ok"

[[check]]
id = "v4_channel_credential_absent"
set = "canal.websocket"
citation = "AfirmaWebSocketServerV4.java:72-78; ProtocolInvocationLauncherErrorManager.java:77, 134"
statement = """
Si el mensaje no incluye el identificador de sesión o este difiere del negociado en el arranque, el
servidor responde con SAF_46.
"""
drive = { mode = "v4", script = "protocol-v4" }
assistance = "none"
condition = [
  "the-echo-without-a-session-answers-saf-46",
  "the-echo-with-another-session-answers-saf-46",
]

[[check]]
id = "v4_channel_credential_malformed"
set = "canal.websocket"
citation = "ProtocolInvocationLauncher.java:992-1008; AfirmaWebSocketServerV4.java:72-78"
statement = """
Si idsession en la URL de arranque contiene caracteres no alfanuméricos, se anula y el servidor no
rechaza los mensajes con SAF_46.
"""
drive = { mode = "v4", script = "protocol-v4-malformed-id" }
assistance = "none"
condition = "a-malformed-session-binds-nothing"

[[check]]
id = "v4_single_client"
set = "canal.websocket"
citation = "AfirmaWebSocketServer.java:70, 73-79, 82-91"
statement = """
La primera conexión se fija en wsClient; el cierre de conexiones secundarias no finaliza la
aplicación, que sólo termina cuando se cierra el cliente principal.
"""
drive = { mode = "v4", script = "protocol-v4" }
assistance = "none"
condition = "a-second-client-leaves-the-channel-alive"

[[check]]
id = "v3_ports_default_fixed"
set = "canal.websocket"
citation = "ProtocolInvocationLauncher.java:87, 233-236; AfirmaWebSocketServer.java:51-56"
statement = """
En versión 3, la ausencia de ports en la URL de arranque asigna por defecto el puerto fijo 63117
(DEFAULT_WEBSOCKET_PORT).
"""
drive = { mode = "v3", script = "protocol-v3" }
assistance = "none"
condition = "the-fixed-port-bound"

[[check]]
id = "v3_echo_greeting"
set = "canal.websocket"
citation = "AfirmaWebSocketServer.java:33, 103-105"
statement = """
En versión 3, cualquier mensaje que empiece por echo= responde inmediatamente OK sin exigir @EOF ni
identificador de sesión.
"""
drive = { mode = "v3", script = "protocol-v3" }
assistance = "none"
condition = "a-bare-echo-answers-ok"

[[check]]
id = "v3_channel_credential_ignored"
set = "canal.websocket"
citation = "AfirmaWebSocketServer.java:99-115"
statement = """
En versión 3, el servidor no valida el identificador de sesión en los mensajes entrantes y no emite
SAF_46.
"""
drive = { mode = "v3", script = "protocol-v3" }
assistance = "none"
condition = "an-echo-without-a-session-is-not-refused"

[[check]]
id = "v3_single_client"
set = "canal.websocket"
citation = "AfirmaWebSocketServer.java:82-91"
statement = """
En versión 3, el cierre de una conexión secundaria no termina la aplicación; el canal principal
sigue activo.
"""
drive = { mode = "v3", script = "protocol-v3" }
assistance = "none"
condition = "a-second-client-leaves-the-channel-alive"

[[check]]
id = "the_v4_channel_answers_saf_47_to_an_origin_that_is_not_loopback"
set = "canal.websocket"
citation = "AfirmaWebSocketServerV4.java:57-68, 100-102"
statement = """
El canal de la versión 4 responde SAF_47 a un mensaje que le llega desde una dirección de origen
fuera del bucle local, aunque venga del propio equipo.
"""
drive = { mode = "v4", script = "protocol-v4-foreign-origin" }
assistance = "none"
condition = "a-foreign-origin-answers-saf-47"

[[check]]
id = "websocket_operation_protocol_version_ignored"
set = "canal.websocket"
citation = "AfirmaWebSocketServerV4.java:91; ProtocolInvocationLauncher.java:189, 653-655"
statement = """
Por el canal WebSocket la versión de protocolo de la operación la fija el canal: un ver=5 en la
petición se ignora, no se rechaza con SAF_21, y la operación sigue hasta su siguiente comprobación.
"""
drive = { mode = "v4", script = "protocol-v4" }
assistance = "none"
condition = "ver-5-is-ignored"

[[check]]
id = "websocket_rejects_a_protocol_version_it_does_not_support"
set = "canal.websocket"
citation = "AfirmaWebSocketServerManager.java:36, 100-107; ProtocolInvocationLauncher.java:240-245"
statement = """
El canal WebSocket sólo admite las versiones de protocolo 3 y 4: una URL de arranque que pide una
posterior, v=99, se rechaza antes de ligar puerto alguno y no abre canal.
"""
drive = { mode = "v4", script = "protocol-v4-version-99" }
assistance = "none"
condition = "an-unsupported-version-opens-no-channel"

[[check]]
id = "websocket_rejects_an_obsolete_protocol_version"
set = "canal.websocket"
citation = "AfirmaWebSocketServerManager.java:36, 100-107; ProtocolInvocationLauncher.java:240-245"
statement = """
Una URL de arranque del canal WebSocket que pide una versión anterior a la 3, v=1, se rechaza antes
de ligar puerto alguno y no abre canal.
"""
drive = { mode = "v4", script = "protocol-v4-version-1" }
assistance = "none"
condition = "an-unsupported-version-opens-no-channel"

[[check]]
id = "a_websocket_that_cannot_bind_its_ports_shows_saf_45"
set = "canal.websocket"
citation = "ProtocolInvocationLauncher.java:246-251"
bug = "BUG-33"
statement = """
Si el canal WebSocket no puede ligar ninguno de sus puertos, el cliente avisa con SAF_45 en vez de
quedarse sin canal en silencio.
"""
drive = { mode = "v4", script = "protocol-v4-occupied-ports" }
assistance = "person"
harness = "occupied_service_ports"
ports = [54451, 54452, 54453]
condition = "no-channel-opens"
question = "¿avisó la aplicación de que no pudo abrir el canal con la página (SAF_45)? [s/n]"
person = { yes = "se avisó de que el canal no se pudo abrir", no = "el fallo al ligar terminó en silencio: no se avisó a quien está delante", yes_means = "conforme" }
warning = "La suite ocupa los tres puertos del canal: el cliente no podrá abrirlo. Fíjate en si avisa de ello."

[[check]]
id = "the_v3_channel_takes_the_version_of_each_operation"
set = "canal.websocket"
citation = "AfirmaWebSocketServer.java:41, 113; ProtocolInvocationLauncher.java:653-655; ProtocolInvocationLauncherSign.java:132-140"
statement = """
El canal v3 no fija versión: cada operación toma la de su ver, y ver=5 se rechaza con SAF_21.
"""
drive = { mode = "v3", script = "protocol-v3" }
assistance = "none"
condition = "ver-5-over-v3-saf-21"

[[check]]
id = "a_second_operation_reuses_the_open_channel"
set = "canal.websocket"
citation = "autoscript.js:2094-2131; MCF anexo I.1, pág. 158"
statement = """
Una segunda operación de la sede viaja por el WebSocket que abrió la primera, sin volver a invocar
la aplicación.
"""
drive = { mode = "v4", script = "selectcerttwice" }
assistance = "click"
condition = "the-second-operation-reuses-the-channel"
warning = "Va a aparecer dos veces el diálogo de selección de certificado: elige uno cada vez."

[[check]]
id = "non_ascii_text_travels_in_utf8"
set = "canal.websocket"
citation = "ProtocolInvocationLauncherLoad.java:132-134; MCF §7.1, pág. 85"
statement = """
El nombre de un fichero cargado que no es ASCII llega a la sede tal cual, codificado en UTF-8.
"""
drive = { mode = "v4", script = "loadnonascii" }
assistance = "person"
harness = "a_file_with_a_non_ascii_name"
condition = "the-name-arrives-in-utf8"
question = "¿se pidió elegir el fichero a cargar? [s/n]"
person = { yes = "se pidió elegir qué fichero cargar", no = "no se pidió elegir qué fichero cargar", yes_means = "conforme" }
warning = "Se va a pedir qué fichero cargar: elige «señal-año.bin», el que prepara la suite."
