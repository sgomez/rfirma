# Las comprobaciones del conjunto «canal.servicio»; sus capítulos y su orden los declara `sets.toml`.

[[check]]
id = "the_service_channel_completes_a_certificate_selection"
set = "canal.servicio"
citation = "ServiceInvocationManager.java:103-169; CommandProcessorThread.java:520-620"
statement = """
El carril del socket local completa una selección de certificado igual que el canal WebSocket: sin
esta comprobación ninguna de las suyas es de fiar.
"""
drive = { mode = "service", script = "selectcert" }
assistance = "click"
completes = {}
warning = "Va a aparecer el diálogo de selección de certificado: elige uno para que la comprobación llegue a medir algo."

[[check]]
id = "the_service_channel_reports_a_bind_failure_instead_of_claiming_success"
set = "canal.servicio"
citation = "ServiceInvocationManager.java:136-143, 148-168; ProtocolInvocationLauncher.java:281-291"
statement = """
Si el canal no puede ligar ninguno de los puertos ofrecidos, la aplicación se lo dice a la persona
usuaria en vez de terminar en silencio. La sede no puede enterarse por ningún cliente: sin puerto
ligado no hay cable de vuelta, y el cliente publicado acaba en «la aplicación no está instalada».
"""
drive = { mode = "service-bind-failure", script = "selectcert" }
assistance = "person"
harness = "occupied_service_ports"
no_answer = true
ports = [63131, 63132, 63133]
question = "¿avisó la aplicación de que no pudo abrir el canal con la página? [s/n]"
person = { yes = "se avisó de que el canal no se pudo abrir", no = "el fallo al ligar terminó en silencio: no se avisó a quien está delante", yes_means = "conforme" }
warning = "La suite ocupa los tres puertos del canal: el cliente no podrá abrirlo, y la página tardará unos 30 segundos en rendirse."

