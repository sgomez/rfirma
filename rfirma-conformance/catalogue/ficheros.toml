[[check]]
id = "save_rejects_illegal_extensions_with_saf_03"
set = "ficheros"
citation = "UrlParametersToSave.java:221-233"
statement = """
Unas exts con un carácter que no admiten —los prohibidos en un nombre de fichero, ; o un espacio—
