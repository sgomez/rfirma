# Las comprobaciones del conjunto «ficheros»; sus capítulos y su orden los declara `sets.toml`.

[[check]]
id = "save_rejects_an_illegal_filename_with_saf_03"
set = "ficheros"
citation = "UrlParametersToSave.java:27, 207-219"
statement = """
Un filename con alguno de los caracteres que el sistema de ficheros no admite se rechaza con SAF_03
antes de pedir destino alguno.
"""

[check.drive]
mode = "v4"
script = "savewithanillegalfilename"
act.consent = "AutoFirma enseña un diálogo de error antes de contestar el rechazo: ciérralo para que llegue la respuesta."
expects.code = "SAF_03"

[[check]]
id = "save_confirms_before_writing_over_a_file_that_already_exists"
set = "ficheros"
citation = "JSEUIManager.java:781-803; ProtocolInvocationLauncherSave.java:79-91"
statement = """
Elegir como destino un fichero que ya existe pide confirmación antes de escribir encima: si no se
confirma, vuelve a pedir destino, y cancelarlo termina el trámite como cancelación.
"""

[check.drive]
mode = "v4"
script = "save"
harness = "a_file_to_overwrite"
act.refuse = "Se va a pedir dónde guardar: acepta el nombre propuesto, challenge.bin, que ya existe porque se ha preparado; cuando te pregunte si lo sobrescribes, di que no, y cancela el diálogo de guardar que vuelve a abrirse."
expects.code = "CANCEL"

[[check]]
id = "load_answers_the_name_of_the_chosen_file_next_to_its_content"
set = "ficheros"
citation = "ProtocolInvocationLauncherLoad.java:95-103, 132-139; UrlParametersToLoad.java:27, 179-191"
statement = """
load pide qué fichero cargar y responde su nombre junto a su contenido, separados por el delimitador
que el protocolo fija.
"""

[check.drive]
mode = "v4"
script = "load"
harness = "files_to_load"
act.pick_file = "Se va a pedir qué fichero cargar: elige primero.bin, uno de los preparados."
expects.completes.conditions = ["the-name-next-to-the-content"]

[[check]]
id = "multiload_answers_every_chosen_file_apart"
set = "ficheros"
citation = "UrlParametersToLoad.java:21, 165-170; ProtocolInvocationLauncherLoad.java:132-139"
statement = """
Con multiload, la carga admite elegir varios ficheros y la respuesta trae cada uno con su nombre y
su contenido, separados por el delimitador que el protocolo fija.
"""

[check.drive]
mode = "v4"
script = "multiload"
harness = "files_to_load"
act.pick_file = "Se va a pedir qué ficheros cargar: elige a la vez los dos preparados, primero.bin y segundo.bin."
expects.completes.conditions = ["every-file-apart"]

[[check]]
id = "save_answers_a_confirmation_the_published_client_recognises"
set = "ficheros"
citation = "CommandProcessorThread.java:290-305; AfirmaWebSocketServer.java:113; JSEUIManager.java:695-838"
bug = "BUG-18"
statement = """
save pide destino y responde una confirmación de guardado que el cliente publicado reconoce como
tal, no como una firma.
"""

[check.drive]
mode = "v4"
script = "save"
act.save_as_proposed = "Va a aparecer la ventana nativa para elegir dónde guardar el fichero: guárdalo con el nombre que propone."
expects.code = "SAVE_OK"

[[check]]
id = "a_save_that_cannot_write_asks_for_another_destination"
set = "ficheros"
citation = "JSEUIManager.java:808-824; ProtocolInvocationLauncherSave.java:93-99"
statement = """
Un fallo de escritura al guardar no termina el trámite: se avisa del error y se vuelve a pedir
destino, y cancelar entonces llega a la sede como cancelación.
"""

[check.drive]
mode = "v4"
script = "save"
harness = "a_file_that_cannot_be_written"
act.cancel = "Se va a pedir dónde guardar: acepta el nombre propuesto, challenge.bin, que ya existe y es de solo lectura; acepta la confirmación, cierra el aviso de error y, cuando vuelva a pedir destino, cancela."
expects.code = "CANCEL"

[[check]]
id = "a_load_that_cannot_read_answers_saf_25"
set = "ficheros"
citation = "ProtocolInvocationLauncherLoad.java:143"
statement = """
Un fallo de lectura al cargar, sobre un fichero que no se deja leer, sale con SAF_25.
"""

[check.drive]
mode = "v4"
script = "load"
harness = "a_file_that_cannot_be_read"
act.pick_file = "Se va a pedir qué fichero cargar: elige ilegible.bin, que se ha preparado sin permiso de lectura, y cierra el aviso de error que pueda aparecer."
expects.code = "SAF_25"

[[check]]
id = "save_without_data_answers_saf_03"
set = "ficheros"
citation = "UrlParametersToSave.java:136-143"
statement = """
Un save sin dat ni fileid se rechaza con SAF_03 antes de pedir destino alguno.
