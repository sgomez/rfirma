[[check]]
id = "save_writes_the_decoded_bytes_of_the_data"
set = "ficheros"
citation = "ProtocolInvocationLauncherSave.java:74-91; UrlParametersToSave.java:136-143"
statement = """
save escribe en el destino elegido los bytes de dat ya decodificados, no su Base64.
"""

[check.drive]
mode = "v4"
script = "savereadback"
harness = "the_saved_file_read_back"
act.save_as_proposed = "Se va a pedir dónde guardar: acepta el nombre propuesto, challenge.bin, en la carpeta que se abre."
expects.completes.conditions = ["the-decoded-bytes-on-disk"]

[[check]]
id = "save_cancelled_answers_cancel"
set = "ficheros"
citation = "ProtocolInvocationLauncherSave.java:93-99"
statement = """
Cancelar cuando save pide destino termina el trámite como cancelación, y así llega a la sede.
"""

[check.drive]
mode = "v4"
script = "savecancelled"
act.cancel = "Se va a pedir dónde guardar: cancela en vez de guardar."
expects.code = "CANCEL"

