assistance = "person"
patience_secs = 120
condition = "the-local-storage-servlet-refused"
question = "¿mostró la aplicación un error SAF_13? [s/n]"
person = { yes = "la aplicación mostró SAF_13", no = "la aplicación no mostró SAF_13", yes_means = "conforme" }
warning = "La sede pide guardar el resultado en el bucle local: si la aplicación muestra un error, fíjate en su código antes de cerrarlo."

