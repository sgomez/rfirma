[[check]]
id = "save_writes_the_decoded_bytes_of_the_data"
set = "ficheros"
citation = "ProtocolInvocationLauncherSave.java:74-91; UrlParametersToSave.java:136-143"
statement = """
save escribe en el destino elegido los bytes de dat ya decodificados, no su Base64.
