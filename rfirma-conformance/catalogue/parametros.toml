[[check]]
id = "the_storage_servlet_is_validated_like_the_retrieve_servlet"
set = "parametros"
chapter = "02"
citation = "UrlParametersToSign.java:254-275; ProtocolInvocationLauncher.java:651"
statement = """
stservlet se valida con las mismas reglas que rtservlet —esquema http o https, host no local y sin
parámetros propios— cuando la operación viaja por servidor intermedio.
"""
unmeasurable = "El original sólo lo valida cuando la operación viaja por servidor intermedio: por WebSocket ni lo lee, y la suite no monta el StorageService al que se subiría el rechazo."

[[check]]
id = "a_protocol_version_below_the_supported_one_is_accepted"
set = "parametros"
chapter = "02"
citation = "ProtocolVersion.java:62-64; ProtocolInvocationLauncher.java:907-915"
statement = """
ver no tiene cota inferior: una versión menor que la soportada, negativa incluida, se acepta y la
petición sigue hasta el control siguiente. La cota superior en 4, con su SAF_21, la mide el conjunto
de versiones.
"""
