# Las comprobaciones del conjunto «certificado»; sus capítulos y su orden los declara `sets.toml`.

[[check]]
id = "selectcert_answers_the_chosen_certificate_alone"
set = "certificado"
citation = "ProtocolInvocationLauncherSelectCert.java:231-242, 262; autoscript.js:2462-2471"
statement = """
La respuesta de selectcert es el certificado elegido y nada más: uno solo, codificado en Base64
URL-safe, sin firma ni campos añadidos.
"""

[check.drive]
mode = "v4"
script = "selectcert"
act.consent = "Va a aparecer el diálogo de selección de certificado: elige el único que ofrece."
expects.completes.conditions = ["a-certificate-alone"]

[[check]]
id = "selectcert_resolves_the_only_candidate_without_asking"
set = "certificado"
citation = "CertFilterManager.java:145-154; AOKeyStoreDialog.java:726-729"
statement = """
Con headless=true, un único certificado que pase los filtros se resuelve sin pedir que se
elija.
"""

[check.drive]
mode = "v4"
script = "selectcertheadless"
expects.completes.conditions = ["the-only-candidate-without-asking"]

[[check]]
id = "selectcert_cancelled_by_the_person_answers_a_cancellation"
set = "certificado"
citation = "AOKeyStoreDialog.java:741; ProtocolInvocationLauncherSelectCert.java:201-207"
statement = """
Cancelar la selección de certificado termina el trámite como cancelación, y la sede la recibe como
tal en vez de como error.
"""

[check.drive]
mode = "v4"
script = "selectcert"
act.cancel = "Va a aparecer el diálogo de selección de certificado: cancélalo en vez de elegir."
expects.code = "CANCEL"

[[check]]
id = "a_pinned_certificate_is_released_by_resetsticky"
set = "certificado"
citation = "ProtocolInvocationLauncher.java:110-120; ProtocolInvocationLauncherSelectCert.java:139-142"
statement = """
Con un certificado fijado, una operación con resetsticky lo suelta: se elige certificado de
nuevo en vez de devolver el fijado.
"""

[check.drive]
mode = "v4"
script = "stickyreset"
store = "several"
expects.completes.conditions = ["a-new-selection-after-the-reset"]

[[check]]
id = "a_key_of_an_unsupported_type_answers_saf_51"
set = "certificado"
chapter = "13"
citation = "ProtocolInvocationLauncherSign.java:631-640; AOSignConstants.java:365-390"
statement = """
Un certificado cuya clave no es RSA, DSA ni de curva elíptica, como una Ed25519, no compone un
algoritmo de firma: la firma se rechaza con SAF_51 después de elegirlo.
"""

[check.drive]
mode = "v4"
script = "signwithanunsupportedkeytype"
store = "ed25519"
act.consent = "La sede nombra el token PKCS#11 por su biblioteca: su PIN es 1234; elige su único certificado, el Ed25519."
expects.code = "SAF_51"

[[check]]
id = "a_locked_card_answers_saf_52"
set = "certificado"
chapter = "13"
citation = "ProtocolInvocationLauncherSign.java:650-656; AOPkcs1Signer.java:117-120"
statement = """
Una tarjeta bloqueada por agotar los intentos del PIN se rechaza con SAF_52.
"""
unmeasurable = "Solo lo produce JMulticard con una tarjeta DNIe o CERES bloqueada de verdad; un token PKCS#11 bloqueado falla al abrir sesión y responde SAF_08."

[[check]]
id = "filters_combine_their_conditions_with_and"
set = "certificado"
citation = "CertFilterManager.java:188, 266-268; MultipleCertificateFilter.java:34-41"
