[[check]]
id = "a_ver_inside_an_order_leaves_the_negotiated_version_alone"
suite = "transporte.service"
chapter = "04"
citation = "CommandProcessorThread.java:327-361; ProtocolInvocationLauncher.java:300, 650"
statement = """
La versión negociada al abrir el canal rige toda la sesión: un ver dentro de la operación que llega
por cmd= no la cambia, y ver=5 no se rechaza con SAF_21.
"""
drive = { mode = "service", script = "protocol-service" }

[check.expect.autofirma]
verdict = "conforme"

[check.expect.rfirma]
verdict = "no-conforme"
cause = "ADR-0021"
note = "rFirma comprueba ver en toda operación, venga por el transporte que venga, y rechaza ver=5 con SAF_21."

[[check]]
id = "the_service_channel_closes_after_ninety_seconds_of_inactivity"
suite = "transporte.service"
chapter = "04"
citation = "ServiceInvocationManager.java:127-134; CommandProcessorThread.java:452-460"
statement = """
El canal se cierra tras 90 segundos sin órdenes, y una orden inválida no reinicia la cuenta.
"""
unmeasurable = "El temporizador de inactividad vive dentro del sujeto: la suite no instrumenta su máquina virtual ni lee su estado, y el cierre no deja en el cable nada que lo distinga de un sujeto caído."

[check.expect.autofirma]
verdict = "no-observable"

[check.expect.rfirma]
verdict = "no-observable"

[[check]]
id = "concurrent_service_orders_do_not_share_their_state"
suite = "transporte.service"
chapter = "04"
citation = "ServiceInvocationManager.java:136-143; CommandProcessorThread.java:67-69"
statement = """
Dos conversaciones simultáneas con el canal no se mezclan los fragmentos ni las partes del resultado
(BUG-09).
"""
unmeasurable = "La concurrencia entre sesiones depende del estado interno del sujeto y de un entrelazado no determinista: la suite no la puede provocar ni leer desde el cable sin instrumentar la máquina virtual."

[check.expect.autofirma]
verdict = "no-observable"

[check.expect.rfirma]
verdict = "no-observable"
