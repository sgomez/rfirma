# El catálogo de la suite de conformidad: una entrada por exigencia del protocolo `afirma://`.
#
# El enunciado dice qué exige el protocolo, nunca qué hace mal un cliente: un enunciado que
# empiece por «en AutoFirma…» está mal escrito. El cuerpo ejecutable vive en Rust y se liga por
# `id`; aquí sólo están los metadatos. La guarda `conformance_catalogue_is_sound.rs` los vigila.

[[check]]
id = "the_published_client_completes_a_certificate_selection"
suite = "saludo"
chapter = "09"
citation = "ProtocolInvocationLauncherSelectCert.java:134-227; AOKeyStoreDialog.java:720-745"
statement = """
Una selección de certificado se completa de punta a punta: el canal se abre, el eco vuelve y la
respuesta trae el certificado elegido.
"""
