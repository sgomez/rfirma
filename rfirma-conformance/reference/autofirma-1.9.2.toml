[[known]]
id = "save_answers_a_confirmation_the_published_client_recognises"
outcome = "no-conforme"
cause = "BUG-18"
note = "Responde OK por WebSocket, que el cliente publicado procesa como una firma."

[[known]]
id = "signandsave_accepts_an_elliptic_curve_algorithm"
outcome = "no-conforme"
cause = "BUG-05"
note = "El catálogo de algoritmos que signandsave admite deja fuera los de curva elíptica."

[[known]]
id = "a_signature_that_cannot_be_timestamped_reports_the_failure"
outcome = "no-conforme"
cause = "BUG-23"
note = "La firma vuelve sin el sello pedido y la operación no reporta que no se pudo sellar."

[[known]]
id = "a_pades_signature_that_cannot_be_timestamped_reports_the_failure"
outcome = "no-conforme"
cause = "BUG-36"
note = "El PDF vuelve firmado y sin sello: el sellado de PAdES falla antes de llamar a la TSA."

[[known]]
id = "sign_missing_or_invalid_operation_rejected"
outcome = "no-conforme"
cause = "BUG-15"
note = "sign tampoco valida op: sigue hasta el formato, y el guion manda uno que no existe, así que responde SAF_06 sin pedir certificado."

[[known]]
id = "signandsave_rejects_a_request_without_a_verb_with_saf_04"
outcome = "no-conforme"
cause = "BUG-15"
note = "Sin validar cop, signandsave revienta con NullPointerException y reporta SAF_09."

[[known]]
id = "format_auto_over_data_that_is_no_signature_is_rejected_with_saf_17"
outcome = "no-conforme"
cause = "BUG-27"
note = "El firmador nulo revienta con NullPointerException antes de la guarda de SAF_17 y el catch genérico lo reporta como SAF_03."

[[known]]
id = "a_batch_servlet_on_the_local_loopback_is_refused_with_saf_13"
outcome = "no-conforme"
cause = "BUG-28"
note = "La rama batch no captura ParameterLocalAccessRequestedException aparte y el catch de ParameterException la reporta como SAF_03."

[[known]]
id = "a_local_batch_admits_countersign_as_a_suboperation"
outcome = "no-conforme"
cause = "BUG-30"
note = "Sin target en los extraparams, CounterSignTarget.getTarget lanza IllegalArgumentException y el documento vuelve como ERROR_PRE."

[[known]]
id = "a_batch_whose_presigner_does_not_answer_fails_with_saf_26"
outcome = "no-conforme"
cause = "BUG-29"
note = "La ConnectException no es un HttpError y el catch genérico la reporta como SAF_27."

[[known]]
id = "a_filter_of_unknown_kinds_alone_keeps_expired_certificates_hidden"
outcome = "no-conforme"
cause = "BUG-31"
note = "El filtro vacío deja pasar también el caducado: con dos certificados, headless ya no elige solo, sale el diálogo de selección y el trámite no vuelve."

[[known]]
id = "signandsave_cancelled_at_the_visible_area_answers_saf_43"
outcome = "no-conforme"
cause = "BUG-13"
note = "Cancelar el área no aborta: sigue al certificado y a dónde guardar, y contesta CANCEL si se cancela uno de ellos o la firma si se aceptan, nunca SAF_43."

[[known]]
id = "a_xades_enveloped_signature_goes_inside_the_document"
outcome = "no-conforme"
cause = "BUG-32"
note = "El firmador no recibe la variante del formato de la petición y firma como XAdES Enveloping."

[[known]]
id = "a_xades_detached_signature_references_the_document_beside_it"
outcome = "no-conforme"
cause = "BUG-32"
note = "El firmador no recibe la variante del formato de la petición y firma como XAdES Enveloping."

[[known]]
id = "v4_ports_negotiation"
outcome = "no-conforme"
cause = "BUG-33"
note = "El bind del primer candidato falla en el hilo del servidor y el bucle ya no prueba el siguiente."

[[known]]
id = "a_saf_code_travels_to_the_intermediate_server_even_before_the_operation_began"
outcome = "no-conforme"
cause = "BUG-26"
note = "El SAF_03 de un parámetro inválido se enseña en un diálogo y no se sube: la sede se rinde como si no estuviera instalada."

[[known]]
id = "a_cipher_key_of_eight_characters_but_not_eight_bytes_answers_saf_03"
outcome = "no-conforme"
cause = "BUG-34"
note = "Da la key por buena al contar caracteres, firma y sube SAF_12 sin cifrar al no poder usar sus dieciséis bytes como clave DES."

[[known]]
id = "a_key_of_an_unsupported_type_answers_saf_51"
outcome = "no-conforme"
cause = "BUG-35"
note = "SunPKCS11 no carga la clave Ed25519 del token y el fallo de carga se reporta como SAF_08 antes de comprobar el tipo de clave."
