# Entradas del catálogo de la suite de conformidad para el conjunto «saludo».
# Repartido por `catalogue.rs`; la forma de cada entrada la vigila la guarda
# `conformance_catalogue_is_sound.rs`.

[[check]]
id = "the_published_client_completes_a_certificate_selection"
suite = "saludo"
chapter = "09"
citation = "ProtocolInvocationLauncherSelectCert.java:134-227; AOKeyStoreDialog.java:720-745"
statement = """
Una selección de certificado se completa de punta a punta: el canal se abre, el eco vuelve y la
respuesta trae el certificado elegido.
"""
drive = { mode = "v4", script = "selectcert" }
warning = "Va a aparecer el diálogo de selección de certificado: elige uno para que la comprobación llegue a medir algo."

[check.expect.autofirma]
verdict = "conforme"

[check.expect.rfirma]
verdict = "conforme"

[[check]]
id = "the_published_client_completes_a_cades_signature"
suite = "saludo"
chapter = "06"
citation = "ProtocolInvocationLauncherSign.java:409-483; AOSignerFactory.java:92-118"
statement = """
Una firma CAdES en modo explícito se completa de punta a punta y la respuesta trae el certificado
y la firma.
"""
drive = { mode = "v4", script = "signcades" }
warning = "Van a aparecer el diálogo de certificado y el del PIN del token."

[check.expect.autofirma]
verdict = "conforme"

[check.expect.rfirma]
verdict = "conforme"

[[check]]
id = "the_service_channel_completes_a_certificate_selection"
suite = "saludo"
chapter = "04"
citation = "ServiceInvocationManager.java:103-169; CommandProcessorThread.java:520-620"
statement = """
El carril del socket local completa una selección de certificado igual que el canal WebSocket: sin
esta comprobación ninguna de las suyas es de fiar.
"""
drive = { mode = "service", script = "selectcert" }
warning = "Va a aparecer el diálogo de selección de certificado: elige uno para que la comprobación llegue a medir algo."

[check.expect.autofirma]
verdict = "conforme"

[check.expect.rfirma]
verdict = "conforme"

