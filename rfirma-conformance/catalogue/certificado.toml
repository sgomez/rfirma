[[check]]
id = "a_wrong_pin_does_not_cancel_the_signature"
set = "certificado"
citation = "ProtocolInvocationLauncherSign.java:658-674; CertFilterManager.java:101-108"
statement = """
Un PIN erróneo al firmar no cancela la operación: el PIN se vuelve a pedir y, con el bueno, la firma
se completa.
"""

[check.drive]
mode = "v4"
script = "signcades"
store = "token"
patience_secs = 180
act.wrong_pin = "Elige el certificado RSA del token y teclea un PIN erróneo, 0000; cuando vuelva a pedirse, elígelo otra vez y teclea el de verdad, 1234."
expects.completes = {}
