"""
drive = { mode = "v4", script = "protocol-v4" }

[check.expect.autofirma]
verdict = "conforme"

[check.expect.rfirma]
verdict = "conforme"

[[check]]
id = "websocket_channel_supported_versions_accepted"
suite = "versiones"
chapter = "14"
citation = "AfirmaWebSocketServerManager.java:36, 100-107"
statement = """
El canal WebSocket admite las versiones de protocolo 3 y 4 (SUPPORTED_PROTOCOL_VERSIONS): las dos
llegan a abrir canal.
"""
drive = { mode = "v3", script = "protocol-v3" }
harness = "supported_websocket_versions"

[check.expect.autofirma]
verdict = "conforme"

[check.expect.rfirma]
verdict = "conforme"

[[check]]
id = "service_channel_version_range"
suite = "versiones"
chapter = "14"
citation = "ServiceInvocationManager.java:42-45, 212-220; ProtocolInvocationLauncher.java:281-288"
statement = """
El canal socket HTTP (afirma://service) sólo admite las versiones 1, 2 y 3; la versión 4 se rechaza
con SAF_21.
"""
drive = { mode = "service-v4", script = "selectcert" }
expects_saf = "SAF_21"

[check.expect.autofirma]
verdict = "conforme"

[check.expect.rfirma]
verdict = "conforme"

[[check]]
id = "websocket_rejects_a_protocol_version_it_does_not_support"
suite = "versiones"
chapter = "14"
citation = "AfirmaWebSocketServerManager.java:36, 100-107; ProtocolInvocationLauncher.java:240-245"
statement = """
El canal WebSocket sólo admite las versiones de protocolo 3 y 4. Una URL de arranque que pida otra
—v=1, obsoleta; v=99, no soportada— se rechaza con SAF_21, y el código llega al cliente.
"""
drive = { mode = "v1", script = "selectcert" }
expects_saf = "SAF_21"
needs = ["espera:60"]
warning = "El cliente publicado agota sus reintentos antes de rendirse: la comprobación tarda alrededor de un minuto."

[check.expect.autofirma]
verdict = "no-observable"
cause = "BUG-25"
note = "El cliente publicado agota sus reintentos y se rinde con ApplicationNotFoundException sin que ningún código llegue al cable."

[check.expect.rfirma]
verdict = "conforme"

