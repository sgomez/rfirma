# Las comprobaciones del conjunto «canal.intermedio»; sus capítulos y su orden los declara `sets.toml`.

[[check]]
id = "the_intermediate_server_completes_a_certificate_selection"
set = "canal.intermedio"
citation = "ProtocolInvocationLauncher.java:370-430; ProtocolInvocationLauncherSelectCert.java:245-257; autoscript.js:4337-4360"
statement = """
Por servidor intermedio se completa una selección de certificado: la aplicación sube el resultado
a stservlet y la sede lo recoge de rtservlet. Sin esta comprobación ninguna de las suyas es de fiar.
"""
drive = { mode = "relay", script = "relayselectcert" }
assistance = "click"
greeting = true
patience_secs = 120
completes = {}
warning = "Va a aparecer el diálogo de selección de certificado: elige uno para que la comprobación llegue a medir algo."

[[check]]
id = "the_result_is_uploaded_ciphered_with_the_session_key"
set = "canal.intermedio"
citation = "ProtocolInvocationLauncherSelectCert.java:245-257; UrlParameters.java:255, 327-345; autoscript.js:4833-4840"
statement = """
Con una key de 8 caracteres en la petición, el resultado se sube a stservlet cifrado con ella:
cada parte como su relleno, un punto y el cifrado en Base64.
"""
drive = { mode = "relay", script = "relayselectcert" }
assistance = "click"
patience_secs = 120
condition = "the-result-uploaded-ciphered"
warning = "Va a aparecer el diálogo de selección de certificado: elige uno."

[[check]]
id = "active_waiting_announces_wait_every_ten_seconds"
set = "canal.intermedio"
citation = "ActiveWaitingThread.java:14-15, 36-58; ProtocolInvocationLauncher.java:406-409, 855-858"
statement = """
Con aw=true, mientras dura la operación la aplicación sube #WAIT a stservlet cada diez segundos.
"""
drive = { mode = "relay", script = "relayselectcertslowly" }
assistance = "click"
patience_secs = 180
condition = "wait-announced-every-ten-seconds"
warning = "Va a aparecer el diálogo de selección de certificado: espera unos 25 segundos antes de elegir uno, para que la suite vea varios avisos de espera."

[[check]]
id = "a_long_request_is_retrieved_by_fileid"
set = "canal.intermedio"
citation = "ProtocolInvocationLauncher.java:659-676; ProtocolInvocationLauncherUtil.java:52-84; autoscript.js:3894-3903, 4256-4320"
statement = """
Una petición demasiado larga para la URL la sube la sede a stservlet, y la aplicación, invocada con
fileid y rtservlet, la recupera de rtservlet antes de operar.
"""
drive = { mode = "relay", script = "relay" }
assistance = "click"
patience_secs = 120
condition = "the-request-retrieved-by-fileid"
warning = "Va a aparecer el diálogo de certificado para firmar: elige uno."

[[check]]
id = "a_retriever_error_answers_saf_16"
set = "canal.intermedio"
citation = "ProtocolInvocationLauncherUtil.java:66-70; ProtocolInvocationLauncher.java:663-669"
statement = """
Si rtservlet contesta con un err- a la petición de fileid, la aplicación termina con SAF_16 sin subir
nada a stservlet: la sede no recibe respuesta.
"""
drive = { mode = "relay", script = "relayretrievalfailure" }
assistance = "person"
patience_secs = 120
condition = "the-retrieval-failure-not-uploaded"
question = "¿mostró la aplicación un error SAF_16? [s/n]"
person = { yes = "la aplicación mostró SAF_16", no = "la aplicación no mostró SAF_16", yes_means = "conforme" }
warning = "El servidor intermedio de la suite no entrega la petición: si la aplicación muestra un error, fíjate en su código antes de cerrarlo."

[[check]]
id = "each_operation_launches_its_own_process"
set = "canal.intermedio"
citation = "autoscript.js:4337-4360; ProtocolInvocationLauncher.java:870-889"
statement = """
Por servidor intermedio no hay canal que dure: cada operación de la sede invoca de nuevo la
aplicación.
"""
drive = { mode = "relay", script = "relaytwice" }
assistance = "click"
patience_secs = 180
condition = "each-operation-launched-apart"
warning = "Va a aparecer dos veces el diálogo de selección de certificado: elige uno cada vez."

[[check]]
id = "a_saf_code_travels_to_the_intermediate_server_even_before_the_operation_began"
set = "canal.intermedio"
citation = "ProtocolInvocationLauncher.java:601-604, 710-713, 738-743, 870-889"
bug = "BUG-26"
statement = """
Por servidor intermedio el rechazo se sube a stservlet con el prefijo SAF_nn intacto, tanto el de la
operación ya empezada como el de un parámetro que se detecta antes de empezarla (SAF_03): por canal
local ese mismo SAF_03 llega a la sede.
"""
drive = { mode = "relay", script = "relayrefusals" }
assistance = "click"
patience_secs = 180
condition = ["a-saf-after-the-start-travels-intact", "a-saf-before-the-start-travels-intact"]
warning = "La segunda firma lleva un algoritmo que no se admite: la aplicación enseña un error; ciérralo."

[[check]]
id = "an_undecipherable_request_answers_saf_15"
set = "canal.intermedio"
citation = "ProtocolInvocationLauncher.java:659-676; ProtocolInvocationLauncherUtil.java:72-82; CypherDataManager.java:45-60"
statement = """
Si lo que rtservlet entrega por el fileid no se descifra con la key, la aplicación termina con SAF_15
sin subir nada a stservlet: la sede no recibe respuesta.
"""
drive = { mode = "relay", script = "relayundecipherable" }
assistance = "person"
patience_secs = 120
condition = "the-undecipherable-request-not-uploaded"
question = "¿mostró la aplicación un error SAF_15? [s/n]"
person = { yes = "la aplicación mostró SAF_15", no = "la aplicación no mostró SAF_15", yes_means = "conforme" }
warning = "El servidor intermedio de la suite entrega una petición que no se puede descifrar: si la aplicación muestra un error, fíjate en su código antes de cerrarlo."

[[check]]
