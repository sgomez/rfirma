packages:
  - rfirma-app
  - rfirma-conformance/console
  - packaging/repo/site

catalog:
  '@biomejs/biome': 2.5.14
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.7
  '@types/node': 26.6.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.1
  jsdom: 30.1.1
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 7.0.2
  vite: 8.3.0

allowBuilds:
  '@swc/core': false
  esbuild: true
  # Su postinstall reescribiría desde un worktree los hooks que comparte el checkout principal.
  lefthook: false
  sharp: true

# i18next-cli va fijada exacta: la sube una persona, no el reloj de la cadena de suministro.
minimumReleaseAgeExclude:
  - i18next-cli@1.72.4
  # Temporal: quitar cuando @tauri-apps/api@2.12.1 cumpla la edad mínima.
  - '@tauri-apps/api@2.12.1'
