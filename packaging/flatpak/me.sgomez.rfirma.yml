# Manifiesto del flatpak de rfirma, el UNICO canal de distribucion (ADR-0015).
#
# Empaqueta rfirma-app. Hasta el #56 empaquetaba la sonda del #22
# (packaging/flatpak/probe), que se borro al existir la frontera FFI real: dos
# implementaciones de la misma frontera es justo donde este proyecto lleva tres
# hallazgos de fallo silencioso (ADR-0013). Todo lo demas —runtime, permisos, la
# libreria nativa en /app/lib/rfirma, pcsc-lite y OpenSC— es lo que midio el #22
# y se queda tal cual.
app-id: me.sgomez.rfirma
# Rama fija: la version de cada entrega va en <releases> del metainfo, no en
# la rama. Asi el usuario que instala 'stable' sigue recibiendo las siguientes.
branch: stable
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: rfirma

finish-args:
  # Ventana: WebKitGTK bajo Wayland, con respaldo X11.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Lectores de tarjeta fisicos (DNIe): el demonio pcscd corre en el
  # anfitrion y su socket aparece dentro en /run/pcscd/pcscd.comm.
  - --socket=pcsc
  # Paliativo medido en #22: sin el, GTK3 del runtime commitea un buffer que
  # no es dmabuf con sincronizacion explicita negociada y Mutter mata el
  # proceso ("Explicit Sync only supported on dmabuf buffers", Error 71).
  # Reproducido igual en org.gnome.Platform 49 y 50.
  - --env=WEBKIT_DISABLE_COMPOSITING_MODE=1
  # SIN ESTO LA VENTANA SE ABRE CON UN ERROR DE DBUS DENTRO Y NADA MAS.
  # WebKitGTK pide un proxy para CADA carga, tambien para el esquema propio de
  # Tauri, y sin --share=network el portal contesta a ProxyResolver.Lookup con
  #   org.freedesktop.portal.Error.NotAllowed:
  #   This call is not available inside the sandbox
  # que es lo que WebKit acaba pintando como pagina. Medido con
  # `flatpak run --log-session-bus`: dos llamadas, una del proceso de red y
  # otra del proceso web, las dos rechazadas; con esta variable no se hace
  # ninguna. La alternativa seria --share=network, y NO se toma: rfirma firma
  # sin salir a la red y el permiso mas barato es el que no se pide.
  - --env=GIO_USE_PROXY_RESOLVER=dummy
  # Carpeta donde cae el documento firmado (ADR-0011). El recorrido no lleva
  # dialogo por firma, asi que el fichero tiene que caer solo en algun sitio.
  # Es la concesion mas estrecha que resuelve el caso: NO --filesystem=home.
  # TRAMPA MEDIDA en #27: si esta carpeta no existe en el anfitrion, dentro
  # del arenero mkdir y la escritura contestan OK y el fichero no aparece en
  # ninguna parte. La aplicacion NO debe crearla nunca: si no esta, no esta.
  - --filesystem=xdg-documents
  # NO se declara --filesystem=host-os: el modulo PKCS#11 lo aporta el
  # flatpak (modulo `opensc`). Los del anfitrion no cargan aqui dentro.
  # Ni --filesystem=home ni --filesystem=host: la ENTRADA de ficheros sigue
  # entrando por portales, y --filesystem=home tampoco devolveria la ruta
  # real del original (ADR-0011).
  # EXCEPCION CONSCIENTE al ADR-0004 (#95, #101): un almacen de certificados
  # NSS no es un documento y no hay portal que lo sirva. Sin esto el flatpak
  # no ve ningun certificado de Firefox. `:ro` es la mitad importante: rfirma
  # necesita LEER certificados y no tiene ningun motivo para escribir en el
  # perfil ni en las claves de quien firma. Las rutas son las mismas que lee
  # pkcs11::stores en el anfitrion (~/.mozilla/firefox via profiles.ini, y
  # ~/.pki/nssdb). NO se declara --filesystem=home. No hace falta empaquetar
  # NSS: el runtime org.gnome.Platform//50 ya trae libsoftokn3.so.
  - --filesystem=~/.mozilla/firefox:ro
  - --filesystem=~/.pki/nssdb:ro

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/rfirma-app/cargo

modules:
  # 1. La libreria nativa del ADR-0004, construida en el anfitrion con GraalVM
  #    CE 25 (issue #23 midio que no hace falta construirla dentro del SDK).
  #    UN SOLO FICHERO desde el #36: al excluir afirma-ui-utils (ADR-0012) los
  #    cinco auxiliares de AWT dejan de hacer falta.
  #    NO los anadas de vuelta: si libawt.so esta aqui, un JPEG con perfil ICC
  #    ABORTA el proceso (rc=134) en vez de dar un error recuperable, y se lleva
  #    la aplicacion entera. Ver docs/research/exclusion-afirma-ui-utils.md.
  #
  #    EL DIRECTORIO DE CONSTRUCCION NO ES EL DE DISTRIBUCION. `native-image`
  #    sigue emitiendo los cinco auxiliares en target/native; lo que se empaqueta
  #    es target/lib/rfirma, donde `just native` copia UN SOLO fichero por su
  #    nombre. Por eso el install de abajo nombra librfirma_crypto.so y NO lleva
  #    un *.so: un comodin aqui reintroduciria libawt.so el dia que la fuente
  #    apuntase, por descuido, al directorio de construccion.
  - name: libreria-nativa
    buildsystem: simple
    build-commands:
      - install -Dm644 -t /app/lib/rfirma librfirma_crypto.so
      # La invariante, comprobada DURANTE LA CONSTRUCCION y no solo en
      # verifica.sh: si aparece un segundo .so, esto para el flatpak entero en
      # vez de producir un bundle que aborta en cuanto alguien firme con una
      # rubrica de imagen. Es la comprobacion barata de un fallo caro.
      - |
        set -eu
        sobran=$(ls -1 /app/lib/rfirma/*.so | grep -v '/librfirma_crypto\.so$' || true)
        if [ -n "$sobran" ]; then
            echo "ERROR: sobra algo en /app/lib/rfirma:" >&2
            echo "$sobran" >&2
            echo >&2
            echo "Solo puede estar librfirma_crypto.so (ADR-0012). Si lo que" >&2
            echo "sobra es libawt.so, un JPEG con perfil ICC pasa de dar un" >&2
            echo "error recuperable a ABORTAR el proceso (rc=134) y llevarse" >&2
            echo "la aplicacion entera: ver" >&2
            echo "docs/research/exclusion-afirma-ui-utils.md." >&2
            exit 1
        fi
        echo "OK: un solo .so en /app/lib/rfirma"
    sources:
      # La ruta CANONICA del ADR-0013, la que produce `just native`. No es
      # target/native (el directorio de construccion) ni target/ce25-noui (el
      # del banco de medicion del #36): esos eran los rivales que el ADR
      # resolvio, y el manifiesto leia el segundo.
      - type: dir
        path: ../../rfirma-native-bridge/target/lib/rfirma

  # 2. Cliente PC/SC. El demonio pcscd corre en el ANFITRION; aqui solo va la
  #    libreria cliente, que habla con el por el socket que expone
  #    --socket=pcsc. Medido en #22: el runtime no la trae.
  - name: pcsc-lite
    buildsystem: meson
    config-opts:
      - -Dlibsystemd=false
      - -Dlibudev=false
      - -Dlibusb=false
      - -Dpolkit=false
      # El socket que expone --socket=pcsc aparece en /run/pcscd/pcscd.comm.
      - -Dipcdir=/run/pcscd
      - -Dusbdropdir=/app/lib/pcsc/drivers
    sources:
      - type: archive
        url: https://pcsclite.apdu.fr/files/pcsc-lite-2.5.1.tar.xz
        sha256: bfcfe38a20afc49849c6bf55325e38f449fc4b26d3923fdc32b969ae41a8741b
    cleanup:
      - /bin
      - /sbin
      - /include
      - /lib/pkgconfig
      - /share/man

  # 3. El modulo PKCS#11 lo APORTA el flatpak, no el anfitrion. Medido en #22:
  #    el opensc-pkcs11.so del anfitrion no carga dentro del arenero porque sus
  #    libopensc.so.13 y libeac.so.3 no estan, y apuntar LD_LIBRARY_PATH al
  #    anfitrion mezcla librerias de otra glibc dentro del runtime.
  - name: opensc
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-notify
      - --disable-doc
      - --disable-strict
      - --enable-pcsc
      - --with-pcsc-provider=libpcsclite.so.1
    make-install-args:
      # Por omision intenta escribir en /usr/share/p11-kit/modules, que en el
      # arenero de construccion es de solo lectura.
      - p11kitdir=/app/share/p11-kit/modules
      - completiondir=/app/share/bash-completion/completions
    sources:
      - type: archive
        url: https://github.com/OpenSC/OpenSC/releases/download/0.27.1/opensc-0.27.1.tar.gz
        sha256: 976f4a23eaf3397a1a2c3a7aac80bf971a8c3d829c9a79f06145bfaeeae5eca7
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
      - /share/bash-completion
      # De las veintidos herramientas de linea de ordenes solo se conservan
      # las dos que sirven para diagnosticar una tarjeta en soporte.
      - /bin/cardos-tool
      - /bin/cryptoflex-tool
      - /bin/dnie-tool
      - /bin/dtrust-tool
      - /bin/egk-tool
      - /bin/eidenv
      - /bin/gids-tool
      - /bin/goid-tool
      - /bin/iasecc-tool
      - /bin/netkey-tool
      - /bin/openpgp-tool
      - /bin/opensc-asn1
      - /bin/opensc-explorer
      - /bin/piv-tool
      - /bin/pkcs11-register
      - /bin/pkcs15-crypt
      - /bin/pkcs15-init
      - /bin/pkcs15-tool
      - /bin/sc-hsm-tool
      - /bin/westcos-tool

  # 4. La aplicacion. El binario se llama `rfirma` y coincide con `command:` de
  #    arriba y con el [[bin]] de rfirma-app/src-tauri/Cargo.toml: si cambias
  #    uno, cambia los tres.
  #
  #    El FRONTEND SE CONSTRUYE EN EL ANFITRION y entra ya construido en
  #    rfirma-app/dist, igual que la libreria nativa: tauri-build lee
  #    `frontendDist` dentro de su propio build.rs, asi que sin dist no compila
  #    ni una linea de Rust. Ejecuta `just build-ts` antes de `just flatpak`.
  #
  #    POR ESO node-sources.json ESTA VERSIONADO PERO NO SE INCLUYE AQUI. El
  #    ID-07 pide las dos vendorizaciones y `just flatpak-sources` genera las
  #    dos, pero dentro del arenero no hay nada que ejecutar con ellas: en
  #    org.gnome.Sdk//50 NO HAY node (comprobado: `which node` no lo encuentra),
  #    asi que mover `vite build` aqui dentro exigiria anadir la extension de
  #    SDK org.freedesktop.Sdk.Extension.node22, que es otra decision y no la de
  #    este issue. Lo que hay versionado es lo que haria falta el dia que se
  #    tome: hasta entonces node-sources.json lo mantiene al dia la misma puerta
  #    que al de cargo, para que no se pudra en silencio.
  #
  #    SE CONSTRUYE SIN RED (ID-07): NO hay --share=network en ningun modulo.
  #    Las dependencias de cargo entran vendorizadas por cargo-sources.json, que
  #    genera `just flatpak-sources` a partir del Cargo.lock y esta VERSIONADO
  #    aqui al lado. `just check-flatpak-sources` —dentro de `just lint`, y por
  #    tanto del CI— falla si el Cargo.lock cambia y nadie lo regenera.
  #
  #    cargo-sources.json deja el vendor en cargo/vendor y su configuracion en
  #    cargo/config, ambos RELATIVOS al directorio de construccion del modulo
  #    (/run/build/rfirma-app). Por eso CARGO_HOME apunta ahi arriba en
  #    build-options: si cambias el nombre del modulo, cambia tambien esa ruta.
  - name: rfirma-app
    buildsystem: simple
    build-commands:
      # --offline no es adorno: sin red, cargo fallaria igual, pero al llegar a
      # la primera descarga y con un error de red. Asi falla al instante y
      # diciendo QUE falta en el vendor, que es lo que se quiere depurar.
      - cargo build --offline --release --features custom-protocol
        --manifest-path src-tauri/Cargo.toml
      # LA COMPROBACION QUE FALTABA: que el frontal este DENTRO del binario.
      # Sin --features custom-protocol el `dev` de Tauri queda encendido, el
      # binario compila igual de bien y la ventana abre contra
      # http://localhost:1420, que dentro del arenero no existe. Es el fallo de
      # la v0.1 y no lo veia nadie: ni cargo, ni verifica.sh, que solo miraba
      # que el proceso siguiera vivo. Un `grep` del nombre del bundle de vite
      # lo caza al construir, que es donde sale barato.
      - |
        set -eu
        bundle=$(sed -n 's|.*src="\(/assets/index-[^"]*\.js\)".*|\1|p' \
            dist/index.html | head -1)
        if [ -z "$bundle" ]; then
            echo "ERROR: dist/index.html no nombra ningun bundle de vite." >&2
            echo "Ejecuta 'just build-ts' antes de 'just flatpak'." >&2
            exit 1
        fi
        if ! grep -qa -- "$bundle" src-tauri/target/release/rfirma; then
            echo "ERROR: el binario NO empotra el frontal ($bundle)." >&2
            echo >&2
            echo "Falta --features custom-protocol: sin ella el binario abre" >&2
            echo "la ventana contra devUrl (http://localhost:1420) y dentro" >&2
            echo "del arenero no hay nadie escuchando ahi. Ver el bloque" >&2
            echo "[features] de rfirma-app/src-tauri/Cargo.toml." >&2
            exit 1
        fi
        echo "OK: el frontal va dentro del binario ($bundle)"
      - install -Dm755 src-tauri/target/release/rfirma /app/bin/rfirma
      - install -Dm644 me.sgomez.rfirma.desktop
        /app/share/applications/me.sgomez.rfirma.desktop
      - install -Dm644 me.sgomez.rfirma.metainfo.xml
        /app/share/metainfo/me.sgomez.rfirma.metainfo.xml
      - install -Dm644 src-tauri/icons/icon.png
        /app/share/icons/hicolor/64x64/apps/me.sgomez.rfirma.png
    sources:
      - type: dir
        path: ../../rfirma-app
        skip:
          # Lo que no entra: las dependencias de node (las usa `vite build` en
          # el anfitrion, no la construccion) y el target de cargo del
          # anfitrion, que ademas trae objetos enlazados contra otra glibc.
          - node_modules
          - src-tauri/target
      - type: file
        path: me.sgomez.rfirma.desktop
      - type: file
        path: me.sgomez.rfirma.metainfo.xml
      # Las dependencias de cargo, vendorizadas. Va AL FINAL: son 955 entradas
      # y arriba estan las que se leen a mano.
      - cargo-sources.json
