# Excepcion para el kit FNMT de pruebas (ADR-0014, TD-07).
#
# testdata/fnmt/ contiene tres PKCS#12 con clave privada de verdad, y el
# escaner de secretos tiene razon en verlos. Son, sin embargo, material que
# publica la propia FNMT con la contrasena incluida, de una CA de PRUEBAS, y
# versionarlos es lo que da los casos que no podriamos fabricar: revocado con
# OCSP en vivo y caducado de verdad. Alertar sobre ellos en cada empuje es
# ruido que ensena a ignorar las alertas que si importan.
#
# El certificado personal del titular NO esta aqui ni en ningun otro sitio del
# repositorio; esta exclusion no lo cubre y no debe crecer para cubrirlo.
paths-ignore:
  - 'testdata/fnmt/**'
