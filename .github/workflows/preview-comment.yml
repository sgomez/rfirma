name: Preview Comment

on:
  workflow_run:
    workflows: [Preview]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: ${{ !contains(fromJSON('["cancelled", "skipped"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Descarga el manifiesto de la ejecución
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: paquetes
          path: ${{ runner.temp }}/paquetes
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Compone el comentario
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          manifest="$TEMP_DIR/paquetes/paquetes.json"
          if [ ! -f "$manifest" ]; then
            mkdir -p "$TEMP_DIR/paquetes"
            echo '[]' > "$manifest"
          fi
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | [.name, .id, .size_in_bytes, .expires_at] | @tsv' \
            | scripts/preview-comment.sh "$manifest" > "$TEMP_DIR/comentario.md"

      - name: Publica el comentario
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          body="$TEMP_DIR/comentario.md"
          if [ ! -s "$body" ]; then
            echo "Nada que comentar."
            exit 0
          fi
          marker="$(head -1 "$body")"
          pr="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')"
          if [ -z "$pr" ]; then
            echo "Ninguna PR abierta para $SHA."
            exit 0
          fi
          existing="$(gh api --paginate "repos/$REPO/issues/$pr/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F "body=@$body" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$pr/comments" -F "body=@$body" > /dev/null
          fi
