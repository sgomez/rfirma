# Sirve la serie de una Release publicada que no es candidata, verificada antes de construir el arbol (ADR-0015).
name: Publicacion

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta de la Release a publicar (ej. v0.9.0); lanzar con --ref sobre esa misma etiqueta'
        required: true
        type: string

permissions: {}

# Sin cancelar: un `rsync` abortado deja el anfitrion a medias.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Reconstruye y publica
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clave de firma
        id: gpg
        uses: ./.github/actions/import-signing-key
        with:
          private-key: ${{ secrets.GPG_SIGNING_SUBKEY }}
          passphrase: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
          expected-fingerprint: ${{ vars.GPG_FINGERPRINT }}

      - name: La serie vigente
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: packaging/repo/download-series.sh "$TAG" serie

      - name: Herramientas de los tres repositorios
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ostree flatpak dpkg-dev apt-utils createrepo-c rpm gnupg rsync openssh-client

      - name: El arbol nuevo
        env:
          FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
          GPG_PASSPHRASE_FILE: ${{ steps.gpg.outputs.passphrase-file }}
        run: |
          set -euo pipefail
          gpg --armor --export "$FINGERPRINT" > rfirma.asc
          packaging/repo/build-tree.sh serie arbol rfirma.asc "$FINGERPRINT"

      # La clave del anfitrion va fijada de antemano: aceptar la que venga entregaria el arbol a quien conteste.
      - name: Llave del anfitrion
        env:
          SSH_KEY: ${{ secrets.PUBLISH_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.PUBLISH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/publish
          chmod 600 ~/.ssh/publish
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Publica
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DESTINO: "${{ vars.PUBLISH_SSH_USER }}@${{ vars.PUBLISH_SSH_HOST }}:"
          RSYNC_RSH: "ssh -i ~/.ssh/publish -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
        run: packaging/repo/publish-tree.sh arbol "$TAG" "$DESTINO"

      - name: Resumen
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          {
            echo "### $TAG en servicio"
            echo "El arbol \`arboles/$TAG\` esta subido y \`actual\` apunta a el."
          } >> "$GITHUB_STEP_SUMMARY"
