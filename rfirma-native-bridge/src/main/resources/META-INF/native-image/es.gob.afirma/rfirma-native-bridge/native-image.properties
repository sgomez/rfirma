# Metadatos de native-image, VERSIONADOS (ID-06, ADR-0013).
#
# native-image recoge este fichero del classpath solo, sin ninguna bandera, asi
# que la imagen se construye igual desde un clon limpio que aqui. La receta
# `just native` pasa unicamente --shared y el -cp: si alguna vez vuelve a haber
# banderas sueltas en el justfile, es que este fichero se ha quedado corto.
#
# Regenerar estos metadatos con el agente de trazado
# (-agentlib:native-image-agent) es un acto MANUAL Y EXPLICITO, nunca parte de la
# construccion: un fichero generado dentro del build es un fichero que nadie ha
# mirado. El procedimiento y las trazas de donde salieron estan en
# docs/research/native-image-postfirma-ce25.md.
#
# --no-fallback: sin esto, si algo no es alcanzable estaticamente native-image
#   produce una "imagen de reserva" que en realidad arranca una JVM entera. Eso
#   no es una libreria compartida: es un fallo disfrazado de exito.
#
# -H:Name: el nombre del fichero, librfirma_crypto.so. Es el que carga Rust por
#   ruta relativa al ejecutable (../lib/rfirma) y el que instala el manifiesto
#   flatpak en /app/lib/rfirma.
#
# -H:IncludeResources=com/lowagie/text/pdf/fonts/.*: los .afm de iText. Sin
#   ellos los dos casos con rubrica revientan con "ExceptionConverter: Courier
#   not found as resource"; native-image no los mete solos porque se cargan por
#   nombre. Medido en docs/research/exclusion-afirma-ui-utils.md y repetido en
#   CE 25 en docs/research/native-image-postfirma-ce25.md.
#
# -H:IncludeResourceBundles=policy: el `policy.properties` de afirma-core, que
#   es de donde `AdESPolicyPropertiesManager` saca el identificador de la
#   politica, su huella y su calificador cuando `ExtraParamsProcessor` expande
#   `expPolicy` (ID-266). Se carga por `ResourceBundle.getBundle("policy", ...)`,
#   asi que native-image no lo alcanza solo y sin el la expansion sale con las
#   claves vacias: la firma se haria, y no llevaria la politica que la sede
#   declaro.
#
# -Djava.awt.headless=true: en tiempo de CONSTRUCCION. La clase NativeBridge lo
#   vuelve a poner en su inicializador estatico para el tiempo de ejecucion; son
#   dos momentos distintos y hacen falta los dos.

Args = --no-fallback \
       -H:Name=librfirma_crypto \
       -H:IncludeResources=com/lowagie/text/pdf/fonts/.* \
       -H:IncludeResourceBundles=policy \
       -Djava.awt.headless=true
