person = { yes = "la segunda operación usó el almacén elegido en la primera", no = "la segunda operación no recordó el almacén elegido en la primera", yes_means = "conforme" }
warning = "En la primera selección, cambia en el diálogo al almacén PKCS#12 y abre testdata/fnmt/active-ecc.p12 (contraseña 1234); en la segunda, fíjate en qué almacén te ofrece y cancela."

