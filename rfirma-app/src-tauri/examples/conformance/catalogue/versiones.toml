[[check]]
id = "websocket_handshake_session_query_parameter"
suite = "versiones"
chapter = "14"
citation = "AfirmaWebSocketServerV4.java:49-74"
statement = """
En versión 4 se exige idsession en la query string del handshake HTTP de WebSocket
