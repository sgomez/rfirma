[[check]]
id = "unsupported_protocol_uri_rejected"
suite = "errores"
chapter = "15"
citation = "ProtocolInvocationLauncher.java:172-178"
statement = """
Una URI que no empieza estrictamente por afirma:// se rechaza con SAF_02.
"""
drive = { mode = "bad-uri", script = "selectcert" }
expects_saf = "SAF_02"

[check.expect.autofirma]
verdict = "conforme"

[check.expect.rfirma]
verdict = "conforme"

