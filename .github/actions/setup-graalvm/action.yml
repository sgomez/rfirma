name: Instala GraalVM CE
description: Instala la GraalVM CE que fija versions.env.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/load-versions

    - id: version
      shell: bash
      run: |
        echo "version=$GRAALVM_VERSION" >> "$GITHUB_OUTPUT"
        echo "java=${GRAALVM_VERSION%%.*}" >> "$GITHUB_OUTPUT"

    # Con `version:` busca la etiqueta `graal-<versión>`, no la última CE de `java-version`.
    - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
      with:
        distribution: graalvm-community
        version: ${{ steps.version.outputs.version }}
        java-version: ${{ steps.version.outputs.java }}
